<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter Tight";font-weight:400;src:url(../fonts/Inter_Tight_400_normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:700;src:url(../fonts/Inter_Tight_700_normal.woff2)}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(../fonts/Instrument_Serif_400_italic.woff2)}
:root{--ox:#2A0F14;--ox2:#36151C;--cream:#F4EBDD;--paper:#FBF6EE;--side:#EEE4D4;--gold:#D7AE62;--bronze:#8E6B2C;--plum:#5B4873;--lilac:#B79DC2;--rose:#C3A9A2;--ink:#2A0F14;--quiet:#86726b;--line:rgba(42,15,20,.09);--green:#3f8f62}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--W,1080px);height:var(--H,1920px);overflow:hidden;background:var(--ox)}
body{font-family:"Inter Tight",sans-serif;-webkit-font-smoothing:antialiased;color:var(--cream);position:relative;letter-spacing:-.01em}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 42%,#3d1a22 0%,#2A0F14 62%,#1c080c 100%)}
#light{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(215,174,98,.16),transparent 50%);opacity:0}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;z-index:80;pointer-events:none}
#vig{position:absolute;inset:0;z-index:79;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(6,1,2,.55) 100%);pointer-events:none}
#world{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 48%}
.sc{position:absolute;left:0;top:0;transform-origin:0 0;transform-style:preserve-3d;display:none}
img{display:block;object-fit:cover}
/* ---------- desktop app ---------- */
.win{position:absolute;left:0;top:0;width:1600px;height:1000px;border-radius:22px;background:var(--cream);color:var(--ink);overflow:hidden;
 box-shadow:0 2px 0 rgba(255,255,255,.35) inset,0 80px 160px rgba(0,0,0,.55),0 30px 60px rgba(0,0,0,.35)}
.tb{height:44px;display:flex;align-items:center;padding:0 18px;gap:9px;background:var(--side);border-bottom:1px solid var(--line);position:relative}
.tb i{width:13px;height:13px;border-radius:50%;background:#d9cbb6}.tb span{position:absolute;left:0;right:0;text-align:center;font-size:15px;font-weight:700;color:var(--quiet)}
.body{display:flex;height:956px}
.side{width:262px;background:var(--side);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.03em;padding:4px 6px 14px}
.newc{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;padding:11px 12px;border-radius:12px;background:var(--cream);border:1px solid var(--line);margin-bottom:14px}
.lab{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--quiet);padding:10px 8px 6px}
.li{display:flex;align-items:center;gap:11px;padding:8px;border-radius:12px;font-size:15px;font-weight:700}
.li img{width:46px;height:34px;border-radius:7px}.li span{display:block;font-weight:400;font-size:13px;color:var(--quiet)}
.li.on{background:var(--cream);box-shadow:0 1px 0 rgba(42,15,20,.06)}
.nv{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;font-size:15px;font-weight:700;color:#5d4a46}
.nv.on{background:var(--cream);color:var(--ink)}
.badge{margin-left:auto;font-size:12px;font-weight:700;background:var(--gold);color:var(--ox);border-radius:10px;padding:2px 8px;opacity:0}
.team{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line);font-size:14px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:var(--plum);color:var(--cream);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.team span{display:block;font-weight:400;color:var(--quiet);font-size:12px}
.chat{width:818px;display:flex;flex-direction:column;position:relative;background:var(--cream)}
.ch{height:62px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}
.st{font-size:13px;font-weight:700;padding:4px 10px;border-radius:9px;background:rgba(183,157,194,.3);color:var(--plum)}
.ch .r{margin-left:auto;display:flex;gap:16px;color:var(--quiet)}
.view{flex:1;overflow:hidden;position:relative}
.msgs{position:absolute;left:0;right:0;top:0;padding:26px 28px;display:flex;flex-direction:column;gap:22px}
.me{align-self:flex-end;max-width:520px;background:var(--plum);color:var(--cream);border-radius:20px 20px 6px 20px;padding:10px 10px 14px;font-size:17px;font-weight:700;line-height:1.38}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}.grid6 img{width:100%;height:92px;border-radius:9px}
.me p{padding:0 6px}
.hk{display:flex;gap:12px;align-items:flex-start}.hk .m{width:34px;height:34px;flex:none;margin-top:2px}
.hk .t{font-size:17px;line-height:1.5;max-width:640px}
.steps{display:flex;flex-direction:column;gap:7px;font-size:15px;color:var(--quiet);margin-bottom:6px}
.step{display:flex;align-items:center;gap:9px}.step .ic{width:18px;height:18px;border-radius:50%;border:2px solid rgba(42,15,20,.18);position:relative;flex:none}
.step .ic.ok{border-color:var(--green);background:var(--green)}
.step .ic.ok:after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.step .ic.sp{border-top-color:var(--plum)}
.vers{display:flex;gap:14px;margin-left:46px}
.vc{width:236px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(42,15,20,.04)}
.vc img{width:236px;height:150px}.vc .b{padding:11px 13px 13px}
.vc .k{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--quiet)}
.vc .k em{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--side);padding:3px 7px;border-radius:7px}
.vc .h{font-size:15px;font-weight:700;margin-top:6px;line-height:1.3}
.vc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 14px 28px rgba(42,15,20,.12)}
.comp{margin:0 24px 22px;border-radius:20px;background:var(--paper);border:1px solid rgba(42,15,20,.14);box-shadow:0 6px 18px rgba(42,15,20,.06);padding:14px 14px 12px 18px}
.att{display:flex;gap:8px;height:0;overflow:hidden}.att i{width:86px;height:64px;border-radius:10px;background:var(--side);flex:none;display:block}
.ta{min-height:30px;font-size:18px;line-height:1.45;padding:6px 2px;color:var(--ink)}
.ta .ph{color:var(--quiet)}.car{display:inline-block;width:2px;height:22px;background:var(--ink);vertical-align:-4px;margin-left:1px}
.cb{display:flex;align-items:center;gap:14px;color:var(--quiet);margin-top:4px}
.send{margin-left:auto;width:40px;height:40px;border-radius:13px;background:var(--gold);display:flex;align-items:center;justify-content:center;position:relative}
.send.off{background:#e6dccb}
.pv{flex:1;background:#F7F0E5;padding:18px 26px;display:flex;flex-direction:column;gap:14px;position:relative}
.pvh{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700}
.seg{display:flex;background:var(--side);border-radius:11px;padding:3px;gap:2px;position:relative}
.seg span{font-size:13px;font-weight:700;padding:6px 13px;border-radius:9px;color:var(--quiet);position:relative;z-index:2}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:60px;border-radius:9px;background:var(--cream);box-shadow:0 1px 3px rgba(42,15,20,.12);z-index:1}
.stage{height:600px;position:relative;display:flex;align-items:flex-start;justify-content:center}
.igc{position:absolute;left:50%;top:0;width:400px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(42,15,20,.16);transform:translateX(-50%)}
.igc .h{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14px;font-weight:700}.igc .h span{display:block;font-size:12px;font-weight:400;color:var(--quiet)}
.igc .im{position:relative;width:400px;height:400px;overflow:hidden}.igc .im img{position:absolute;inset:0;width:100%;height:100%}
.igc .cta{display:flex;justify-content:space-between;padding:12px 14px;font-size:14px;font-weight:700;background:#f4efe8}
.igc .cp{padding:11px 14px 14px;font-size:14px;line-height:1.45}
.story{position:absolute;left:50%;top:0;width:330px;height:586px;border-radius:24px;overflow:hidden;transform:translateX(-50%);box-shadow:0 20px 50px rgba(42,15,20,.2);opacity:0}
.story img{position:absolute;inset:0;width:100%;height:100%}
.story .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 30%,transparent 62%,rgba(0,0,0,.55))}
.story .bar{position:absolute;left:12px;right:12px;top:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}.story .bar i{display:block;height:100%;width:40%;background:#fff;border-radius:2px}
.story .who{position:absolute;left:14px;top:24px;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:700}
.story .hl{position:absolute;left:20px;right:20px;top:86px;color:#fff;font-size:30px;font-weight:700;line-height:1.08;letter-spacing:-.03em}
.story .go{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:14px;font-weight:700;padding:10px 18px;border-radius:20px}
.chk{display:flex;flex-direction:column;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.chk div{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 0}.chk b{margin-left:auto;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.hlt{background:linear-gradient(90deg,rgba(215,174,98,.5),rgba(215,174,98,.5)) no-repeat;background-size:0% 100%;border-radius:3px}
/* leads page */
.leads{position:absolute;left:262px;top:44px;width:1338px;height:956px;background:var(--cream);padding:26px 34px;opacity:0}
.leads h2{font-size:26px;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}.leads h2 span{font-size:13px;color:var(--quiet);font-weight:700;background:var(--side);padding:4px 10px;border-radius:9px}
.lt{margin-top:22px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
.lr{display:grid;grid-template-columns:260px 230px 1fr 140px 90px;align-items:center;padding:20px 22px;border-top:1px solid var(--line);font-size:16px}
.lr:first-child{border-top:none;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--quiet);background:var(--side)}
.lr .n{display:flex;align-items:center;gap:12px;font-weight:700}.lr .ad{display:flex;align-items:center;gap:10px}.lr .ad img{width:52px;height:36px;border-radius:7px}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:9px;background:rgba(63,143,98,.12);color:var(--green);justify-self:start}
/* cursor */
#cur{position:absolute;left:0;top:0;width:30px;height:30px;z-index:50;pointer-events:none;transform-origin:3px 2px}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(42,15,20,.35);pointer-events:none}
/* photos flying */
.fly{position:absolute;left:0;top:0;width:430px;height:300px;border-radius:16px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.45);transform-origin:50% 50%;backface-visibility:hidden}
.fly img{width:100%;height:100%}
/* ---------- phone ---------- */
.phone{position:absolute;left:0;top:0;width:430px;height:900px;border-radius:66px;background:#0d0405;padding:13px;box-shadow:0 0 0 2px #3c2328,0 70px 140px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}
.scr{position:relative;width:404px;height:874px;border-radius:54px;overflow:hidden;background:#000;color:var(--ink)}
.isl{position:absolute;left:50%;top:12px;width:120px;height:35px;margin-left:-60px;border-radius:20px;background:#000;z-index:20}
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 36px 0;font-size:16px;font-weight:700;z-index:19}
.lock{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#5b2a33,#2A0F14 60%,#170609);color:var(--cream)}
.lock .tm{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:96px;font-weight:700;letter-spacing:-.04em}
.lock .dt{position:absolute;left:0;right:0;top:100px;text-align:center;font-size:19px;font-weight:700;color:rgba(244,235,221,.75)}
.note{position:absolute;left:12px;right:12px;top:300px;border-radius:24px;background:rgba(250,244,235,.82);backdrop-filter:blur(18px);color:var(--ink);padding:13px 15px;display:flex;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.note .ap{width:40px;height:40px;border-radius:10px;background:var(--ox);display:flex;align-items:center;justify-content:center;flex:none}
.note b{font-size:15px;display:block}.note p{font-size:14px;line-height:1.35;margin-top:2px}.note small{position:absolute;right:15px;top:13px;font-size:12px;color:var(--quiet)}
.note .hd{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--quiet);text-transform:uppercase}
.pa{position:absolute;inset:0;background:var(--cream);opacity:0}
.pa .top{position:absolute;left:0;right:0;top:54px;height:56px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;border-bottom:1px solid var(--line)}
.pa .top i{position:absolute;left:20px;font-style:normal;font-size:26px;color:var(--plum)}
.vstrip{position:absolute;left:0;top:130px;display:flex;gap:14px;padding-left:37px}
.vcard{width:330px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(42,15,20,.14);flex:none}
.vcard img{width:330px;height:330px}.vcard .b{padding:12px 15px 15px;font-size:14px}.vcard .b b{display:block;font-size:17px;margin-top:3px}
.vcard .b em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet)}
.dots{position:absolute;left:0;right:0;top:555px;display:flex;justify-content:center;gap:7px}.dots i{width:7px;height:7px;border-radius:50%;background:#d6c9b6}.dots i.on{background:var(--ox)}
.prow{position:absolute;left:22px;right:22px;display:flex;justify-content:space-between;font-size:15px;padding:12px 0;border-top:1px solid var(--line)}.prow b{font-weight:700}
.apbtn{position:absolute;left:22px;right:22px;top:762px;height:60px;border-radius:18px;background:var(--gold);display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;overflow:hidden;color:var(--ox)}
.apbtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#c99d4f}
.apbtn span{position:relative}
.micro{position:absolute;left:0;right:0;top:832px;text-align:center;font-size:12.5px;color:var(--quiet)}
.feed{position:absolute;inset:0;background:#fff;opacity:0}
.feed .fh{position:absolute;left:0;right:0;top:0;height:100px;background:#fff;z-index:3;display:flex;align-items:flex-end;padding:0 20px 12px;font-size:21px;font-weight:700;border-bottom:1px solid #eee}
.fl{position:absolute;left:0;right:0;top:100px}
.post{padding:10px 0 16px}.post .h{display:flex;align-items:center;gap:9px;padding:0 13px 9px;font-size:13.5px;font-weight:700}.post .h span{font-weight:400;font-size:12px;color:#8b8b8b;display:block}
.post .ai{width:30px;height:30px;border-radius:50%;background:#ddd;flex:none;overflow:hidden}.post .ai img{width:100%;height:100%}
.post img.pi{width:404px;height:404px}.post .cta{display:flex;justify-content:space-between;margin:0;padding:11px 13px;background:#f3f3f3;font-size:13.5px;font-weight:700}
.post .ln{height:11px;border-radius:6px;background:#ececec;margin:10px 13px 0}
.banner{position:absolute;left:10px;right:10px;top:-120px;z-index:25;border-radius:22px;background:rgba(250,244,235,.9);backdrop-filter:blur(16px);padding:12px 14px;display:flex;gap:11px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.banner b{font-size:14px;display:block}.banner p{font-size:13px;line-height:1.3;margin-top:1px}
.tap{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.8);opacity:0;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.2)}
/* ---------- capabilities ---------- */
#wall{position:absolute;left:-460px;top:-200px;width:2000px;height:2600px;transform-origin:50% 40%}
.wl{position:absolute;left:0;width:2000px;text-align:center;font-size:58px;font-weight:700;letter-spacing:-.035em;color:rgba(244,235,221,.055);filter:blur(1.5px);white-space:nowrap}
.bigc{position:absolute;left:70px;top:0;width:940px;border-radius:30px;background:var(--paper);color:var(--ink);padding:26px 26px 22px 32px;box-shadow:0 50px 120px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.4) inset}
.bigc .ta{font-size:36px;font-weight:700;letter-spacing:-.025em;min-height:52px;padding:0}
.bigc .car{height:40px;width:3px;vertical-align:-7px}
.bigc .cb{margin-top:16px}.bigc .send{width:58px;height:58px;border-radius:18px}
.res{position:absolute;left:70px;top:230px;width:940px;border-radius:30px;background:var(--cream);color:var(--ink);overflow:hidden;box-shadow:0 50px 120px rgba(0,0,0,.5);opacity:0}
.res .rh{display:flex;align-items:center;gap:12px;padding:22px 28px 0;font-size:15px;font-weight:700;color:var(--quiet);letter-spacing:.08em;text-transform:uppercase}
.res .rh .m{width:28px;height:28px}
.res h3{font-size:40px;letter-spacing:-.035em;padding:8px 28px 0;line-height:1.08}
.res .s{font-size:19px;color:var(--quiet);padding:8px 28px 0}
.res .ph{position:relative;margin:22px 28px 0;height:420px;border-radius:20px;overflow:hidden}.res .ph img{width:100%;height:100%}
.res .pad{padding:22px 28px 28px}
.sold{position:absolute;left:0;right:0;bottom:0;padding:22px 26px;background:linear-gradient(0deg,rgba(20,6,9,.82),transparent);color:#fff}
.sold b{display:block;font-size:46px;letter-spacing:-.04em;line-height:1}.sold span{font-size:18px;opacity:.85}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chips span{font-size:16px;font-weight:700;padding:9px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:14px}
.br{display:grid;grid-template-columns:72px 200px 1fr 90px;gap:16px;align-items:center;font-size:18px;font-weight:700}
.br img{width:72px;height:50px;border-radius:9px}.br .tr{height:16px;border-radius:8px;background:#eadfcd;overflow:hidden}.br .tr i{display:block;height:100%;width:0;border-radius:8px;background:var(--lilac)}
.br.w .tr i{background:var(--gold)}.br.w .v{color:var(--bronze)}.br .v{text-align:right}.br small{display:block;font-weight:400;color:var(--quiet);font-size:14px}
.sl{position:relative;height:52px;margin-top:10px}.sl .tr{position:absolute;left:0;right:0;top:22px;height:8px;border-radius:4px;background:#eadfcd}
.sl .fi{position:absolute;left:0;top:22px;height:8px;border-radius:4px;background:var(--gold)}
.sl .kn{position:absolute;top:8px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(42,15,20,.25),0 0 0 1px var(--line)}
.amt{font-size:64px;font-weight:700;letter-spacing:-.045em}
.tgl{width:76px;height:44px;border-radius:24px;background:var(--green);position:relative;flex:none}.tgl i{position:absolute;top:4px;left:36px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.rowx{display:flex;align-items:center;gap:18px;padding:16px 0;border-top:1px solid var(--line);font-size:20px}.rowx:first-child{border-top:none}.rowx b{font-size:21px}.rowx img{width:84px;height:58px;border-radius:10px}
.sw{display:flex;gap:12px}.sw i{width:96px;height:96px;border-radius:18px;display:block}
.voice{display:flex;gap:10px;margin-top:18px}.voice span{font-size:18px;font-weight:700;padding:10px 16px;border-radius:12px;background:var(--side)}
/* ---------- report ---------- */
.rep{position:absolute;left:0;top:0;width:940px;border-radius:30px;background:var(--cream);color:var(--ink);padding:30px 34px 34px;box-shadow:0 60px 140px rgba(0,0,0,.55)}
