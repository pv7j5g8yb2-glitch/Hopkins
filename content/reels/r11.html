<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="engine.js"></script>
<script>
// Reel 11: reply fast.
const {$,$$,P,ease,inout,vis,pop,draw,icon,house}=E;
const R={
hook:2,
sfx:[{s:"hit",at:.02,shake:14},{s:"stamp",at:"getsthecall",shake:12},{s:"pop",at:"reply"},{s:"pop",at:"question"},{s:"pop",at:"time"}],
script:["Your lead went cold while you were at the showing.","They messaged three agents.","The first one to reply usually [gets the call.]","So set up three things.","One. An instant ^reply. Even just, thanks, I'll send details shortly.","Two. One ^question. Are you looking to buy this year?","Three. Offer a ^time. Can I show you Saturday at ten?","Reply in minutes, ask one thing, offer a time.","Send this to an agent who replies tomorrow."],
css:`
.big{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
#ad{left:160px;top:640px;width:760px;padding:40px 44px}#ad b{font-size:70px;letter-spacing:-.03em}
#xx{position:absolute;left:560px;top:600px;opacity:0}#xx span{display:inline-block;background:var(--plum);color:var(--cream);font-size:50px;font-weight:700;padding:14px 30px;border-radius:16px;border:5px solid var(--cream);transform:rotate(9deg)}
#fx{left:110px;top:660px;width:860px;padding:40px 44px}
.fr{display:flex;align-items:center;gap:26px;padding:34px 0;border-top:1px solid rgba(42,15,20,.1);font-size:40px;font-weight:700;opacity:0}
.fr small{display:block;font-size:27px;font-weight:400;color:var(--quiet);margin-top:6px}
#snd{position:absolute;left:0;width:1080px;top:820px;display:flex;flex-direction:column;align-items:center;gap:30px;font-size:36px;font-weight:700;color:var(--rose)}
#dm{left:160px;top:660px;width:760px;padding:40px 44px;font-size:46px;font-weight:700}#dm small{display:block;font-size:26px;font-weight:400;color:var(--quiet);margin-top:10px}`,
scenes:`<div class="scene" id="s1"><div class="card" id="dm">New message<small>Is the 14 Oak Street house still available?</small><small>Seen 6 hours ago</small></div><div id="xx"><span>Gone cold</span></div></div>
<div class="scene" id="s2"><div class="card" id="fx"><div class="fr" id="a1">${icon("send",70,"#8E6B2C",2)}<div>Instant reply<small>Thanks, I'll send details shortly</small></div></div><div class="fr" id="a2">${icon("form",70,"#8E6B2C",2)}<div>One question<small>Are you looking to buy this year?</small></div></div><div class="fr" id="a3">${icon("sun",70,"#8E6B2C",2)}<div>Offer a time<small>Can I show you Saturday at ten?</small></div></div></div></div><div class="scene" id="s3"><div id="snd">${icon("send",170,"#D7AE62",1.4)}Send this</div></div>`,
update(t,C,endAt){
E.slam("#dm",t,-.1,{s:1.3,r:3});vis("#s1",t,-1,C.p3);E.slam("#xx",t,C.p1,{s:2,r:16});
 vis("#s2",t,C.p3,C.p8);vis("#fx",t,C.p3,null);
 [["#a1",C.reply],["#a2",C.question],["#a3",C.time]].forEach(([x,a])=>vis(x,t,a-.1,null,{dx:-60,dy:0,blur:6}));
 vis("#s3",t,C.p8,endAt);draw("#snd path",P(t,C.p8,C.p8+.7));
}};
E.boot(R);
render(0);
</script></body></html>
