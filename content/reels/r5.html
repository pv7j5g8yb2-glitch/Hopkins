<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="engine.js"></script>
<script>
const {$,$$,P,ease,inout,vis,pop,draw,count,icon,house}=E;
const R={
script:[
 "Running real estate ads usually means",
 "an ^agency,",
 "a ^freelancer,",
 "or a ^Sunday night in Ads Manager.",
 "Meet ^Hopkins.",
 "One chat that runs your ads.",
 "Ask for ads for a ^listing.",
 "Hopkins ^makes a few to test.",
 "You ^approve every one.",
 "They run on [Instagram and Facebook,]",
 "and every ^Monday, you get the numbers.",
 "One [flat monthly price.]",
 "No cut of your ^ad spend. Cancel any ^time.",
 "Nothing goes live without your _yes._",
 "Early access is ^open.",
 "Teams on the waitlist get [30% off]",
 "their first year.",
],
cta:"Join the waitlist · link in bio",
signoff:true,
css:`
#opts{position:absolute;left:0;width:1080px;top:640px;display:flex;justify-content:center;gap:30px}
.op{width:290px;height:340px;border-radius:28px;background:var(--ox2);border:2px solid rgba(244,235,221,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-size:30px;font-weight:700;text-align:center;line-height:1.15}
#big{position:absolute;left:0;width:1080px;top:700px;display:flex;flex-direction:column;align-items:center;gap:20px}
#big .nm{font-size:130px;font-weight:700;letter-spacing:-.045em}
#chat{left:110px;top:560px;width:860px;height:760px;padding:0;overflow:hidden;display:flex;flex-direction:column}
#chat .hd{display:flex;align-items:center;gap:14px;padding:22px 28px;border-bottom:1px solid rgba(42,15,20,.1);font-size:26px;font-weight:700}
#chat .hd .pv{margin-left:auto;font-size:18px;background:rgba(183,157,194,.35);color:var(--plum);padding:6px 14px;border-radius:20px}
#msgs{flex:1;padding:26px 28px;display:flex;flex-direction:column;gap:20px}
.me{align-self:flex-end;max-width:620px;background:var(--plum);color:var(--cream);border-radius:24px 24px 6px 24px;padding:20px 24px;font-size:26px;line-height:1.35;font-weight:700}
.hk{align-self:flex-start;display:flex;gap:14px;max-width:760px}
.hk .bub{background:var(--paper);border:2px solid rgba(42,15,20,.08);border-radius:24px 24px 24px 6px;padding:20px 24px;font-size:25px;line-height:1.35}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--quiet)}
.thumbs{display:flex;gap:14px;margin-top:16px}.th{width:210px;border-radius:14px;overflow:hidden;background:var(--cream);border:2px solid rgba(42,15,20,.1)}
.th svg{display:block;width:210px;height:130px}.th div{font-size:18px;font-weight:700;padding:10px 12px}
#yes{align-self:flex-end;display:flex;gap:14px}#yes span{font-size:24px;font-weight:700;padding:16px 26px;border-radius:16px}
#yb{background:var(--gold);color:var(--ox)}#cb{border:2px solid rgba(42,15,20,.2)}
#cur{position:absolute;left:0;top:0;width:44px}
#live{position:absolute;left:0;width:1080px;top:600px;display:flex;justify-content:center;gap:20px}
#rep{left:150px;top:760px;width:780px;padding:34px 38px}
#rep h3{font-size:30px;display:flex;justify-content:space-between;align-items:center}#rep h3 span{font-size:21px;color:var(--quiet);font-weight:400}
.rr{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0;border-top:1px solid rgba(42,15,20,.1);font-size:24px;color:var(--quiet)}
.rr b{font-size:46px;color:var(--ink);letter-spacing:-.03em}#cplv{color:var(--bronze)!important}
#pr{left:150px;top:620px;width:780px;padding:36px 40px}#pr h3{font-size:30px;margin-bottom:10px}
.pr{display:flex;align-items:center;gap:22px;padding:26px 0;border-top:1px solid rgba(42,15,20,.1);font-size:32px;font-weight:700}
#tog{position:absolute;left:0;width:1080px;top:700px;display:flex;flex-direction:column;align-items:center;gap:34px}
#sw{width:240px;height:130px;border-radius:70px;background:var(--ox2);position:relative;border:3px solid rgba(244,235,221,.15)}
#sw i{position:absolute;top:12px;left:12px;width:100px;height:100px;border-radius:50%;background:var(--rose)}
#tog .t{font-size:40px;font-weight:700}
#ea{left:150px;top:640px;width:780px;padding:44px;text-align:center}
#ea .k{color:var(--quiet)}#ea .o{font-size:120px;font-weight:700;letter-spacing:-.045em;color:var(--bronze);margin:16px 0 4px;line-height:1}
#ea .y{font-size:30px;font-weight:700}#ea .u{margin-top:30px;display:inline-block;font-size:26px;font-weight:700;padding:16px 26px;border-radius:40px;background:var(--ox);color:var(--cream)}
`,
scenes:`
<div class="scene" id="s1"><div id="opts">
 <div class="op" id="oa">${icon("store",96,"#C3A9A2",1.5)}An agency</div>
 <div class="op" id="of">${icon("user",96,"#C3A9A2",1.5)}A freelancer</div>
 <div class="op" id="os">${icon("calendar",96,"#C3A9A2",1.5)}Sunday night<br>in Ads Manager</div></div></div>
<div class="scene" id="s2"><div id="big"><svg id="bm" width="220" height="220" viewBox="0 0 120 120">${E.MARK}</svg><div class="nm">Hopkins</div></div></div>
<div class="scene" id="s3"><div class="card" id="chat"><div class="hd"><svg width="44" height="44" viewBox="0 0 120 120">${E.MARK}</svg>Hopkins<span class="pv">Preview</span></div>
 <div id="msgs">
  <div class="me" id="m1"><span id="m1t"></span></div>
  <div class="hk" id="m2"><svg width="40" height="40" viewBox="0 0 120 120" style="flex:none">${E.MARK}</svg><div class="bub"><div class="dots" id="d2"><i></i><i></i><i></i></div><div id="m2c" style="display:none">Here are three versions to test against each other.
   <div class="thumbs"><div class="th" id="t1">${house("x1",210,130)}<div>Just listed</div></div><div class="th" id="t2">${house("x2",210,130)}<div>Dusk photo</div></div><div class="th" id="t3">${house("x3",210,130)}<div>Morning sun</div></div></div></div></div></div>
  <div id="yes"><span id="cb">Change one</span><span id="yb">Yes, run them</span></div>
 </div></div>
 <svg id="cur" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19Z" fill="#F4EBDD" stroke="#2A0F14" stroke-width="1.4"/></svg></div>
<div class="scene" id="s4"><div id="live"><span class="pill" style="background:var(--cream);color:var(--ink)" id="l1">${icon("check",28,"#8E6B2C",3)} Live on Instagram</span><span class="pill" style="background:var(--cream);color:var(--ink)" id="l2">${icon("check",28,"#8E6B2C",3)} Live on Facebook</span></div>
 <div class="card" id="rep"><h3>Monday report <span>14 Oak Street</span></h3>
  <div class="rr"><span>Leads this week</span><b id="lv">0</b></div><div class="rr"><span>Cost per lead</span><b id="cplv">$0</b></div><div class="rr"><span>Winning version</span><b style="font-size:34px">Dusk photo</b></div></div>
 <div class="src" style="top:1330px">Preview with example numbers</div></div>
<div class="scene" id="sP"><div class="card" id="pr"><h3>Pricing</h3>
 <div class="pr" id="pr1">${icon("check",40,"#8E6B2C",2.6)}One flat monthly price</div><div class="pr" id="pr2">${icon("check",40,"#8E6B2C",2.6)}No cut of your ad spend</div>
 <div class="pr" id="pr3">${icon("check",40,"#8E6B2C",2.6)}Month to month, cancel any time</div></div></div>
<div class="scene" id="s5"><div id="tog"><div id="sw"><i></i></div><div class="t">Approve every ad</div></div></div>
<div class="scene" id="s6"><div class="card" id="ea"><div class="lbl k">Early access</div><div class="o">30% off</div><div class="y">your first year, for teams on the waitlist</div><div class="u">waitlist.kirmistudio.com</div></div></div>
`,
update(t,C,endAt){
 vis("#s1",t,0,C.e3);
 [["#oa",C.agency],["#of",C.freelancer],["#os",C.sunday]].forEach(([o,a],i)=>{const k=vis(o,t,.15+i*.15,null,{dy:50});$(o).style.opacity=k*(.25+.75*ease(P(t,a-.15,a+.2)));draw(o+" svg *",P(t,a,a+.7))});
 vis("#s2",t,C.p4,C.e4);const r=ease(P(t,C.hopkins,C.hopkins+.9));$("#bm .gd").style.transform=`translate(${(1-r)*-8}px,${(1-r)*18}px)`;
 vis("#s3",t,C.p5,C.e8);vis("#chat",t,C.p5,null);
 vis("#m1",t,C.p5+.5,null,{dy:30});E.type("#m1t",P(t,C.p5+.6,C.listing+.6),"Ads for 14 Oak Street. $600 over two weeks.");
 vis("#m2",t,C.makes-.6,null,{dy:30});const sh=t>=C.makes+.1;$("#d2").style.display=sh?"none":"flex";$("#m2c").style.display=sh?"block":"none";
 $$("#d2 i").forEach((d,i)=>d.style.opacity=.3+.7*Math.abs(Math.sin(t*5+i)));
 ["#t1","#t2","#t3"].forEach((th,i)=>pop(th,P(t,C.makes+.2+i*.15,C.makes+.5+i*.15)));
 vis("#yes",t,C.approve-.4,null,{dy:20});
 const cm=inout(P(t,C.approve-.3,C.approve+.3));$("#cur").style.opacity=E.clamp(P(t,C.approve-.4,C.approve-.2)*3);
 $("#cur").style.transform=`translate(${900-110*cm}px,${1380-170*cm}px) scale(${1-.15*Math.sin(P(t,C.approve+.3,C.approve+.55)*Math.PI)})`;
 $("#yb").style.transform=`scale(${1-.08*Math.sin(P(t,C.approve+.3,C.approve+.55)*Math.PI)})`;
 vis("#s4",t,C.p9,C.e10);pop("#l1",P(t,C.instagramandfacebook,C.instagramandfacebook+.35));pop("#l2",P(t,C.instagramandfacebook+.2,C.instagramandfacebook+.55));
 vis("#rep",t,C.monday,null);count("#lv",P(t,C.monday+.3,C.e10),0,14);count("#cplv",P(t,C.monday+.3,C.e10),0,21,v=>"$"+Math.round(v));
 vis("#sP",t,C.p11,C.e12);vis("#pr",t,C.p11,null);[["#pr1",C.flatmonthlyprice],["#pr2",C.ad],["#pr3",C.time]].forEach(([r,a])=>{vis(r,t,a-.1,null,{dy:16,blur:6});draw(r+" svg *",P(t,a,a+.4))});
 vis("#s5",t,C.p13,C.e13);const sw=ease(P(t,C.yes,C.yes+.3));$("#sw i").style.left=(12+110*sw)+"px";$("#sw i").style.background=sw>.5?"var(--gold)":"var(--rose)";
 $("#sw").style.background=sw>.5?"rgba(215,174,98,.25)":"";
 vis("#s6",t,C.p14,endAt);vis("#ea",t,C.open,null);pop("#ea .o",P(t,C.p15+.3,C.p15+.7));
}};
E.boot(R);E.dusk("x2");["x1","x2","x3"].forEach(id=>draw("#"+id+" .ln",1));
render(0);
</script></body></html>
