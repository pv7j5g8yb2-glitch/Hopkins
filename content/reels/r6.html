update(t,C,endAt){
 // the depth meter: on screen from the first frame, plunges on "niche", then one level per point
 const lv=["one","two","three","four","five","six","seven"].map(c=>C[c]);
 let lev=0;lv.forEach((a,i)=>{if(i)lev+=ease(P(t,a-.1,a+.35))});
 const dive=ease(P(t,C.niche,C.niche+.45)), back=inout(P(t,C.one-.5,C.one+.1));
 const y=t<C.one-.5?dive*900:(1-back)*900+lev*150;
 $("#meter").style.opacity=E.clamp(P(t,0,.15)*6)*(1-E.P(t,endAt,endAt+.3));
 $("#mk").style.transform=`translateY(${y-26}px)`;
 $("#mkn").textContent=t<C.one-.5?(dive>.5?7:1):1+Math.round(lev);
 $$("#meter .dt").forEach((d,i)=>{const on=t>=C.one-.2&&i<=Math.round(lev);d.style.background=on?"var(--gold)":"var(--ox)";d.style.borderColor=on?"var(--gold)":"rgba(244,235,221,.35)"});
 $("#deep").style.opacity=(t<C.one?dive*.6*(1-back):lev/6*.75)*(1-E.P(t,endAt,endAt+.3));
 // hook: the seven cards slam in as one stack, then fan down to show how deep it goes
 vis("#sH",t,0,C.one-.25,{dy:0,blur:0});
 $$(".sk").forEach(el=>{const i=+el.id.slice(2);const k=slam(el,t,.02+i*.035,{s:1.5,r:i%2?7:-7});
  const f=E.back(P(t,C.niche+.05+i*.04,C.niche+.4+i*.04));
  el.style.transform+=` translateY(${f*i*108}px) rotate(${f*(i%2?1.6:-1.6)}deg)`;el.style.zIndex=f>.5?20+i:10-i});
 // 1 housing
 vis("#s1",t,C.p2,C.p7);vis("#hc",t,C.p2,null);
 const hk=P(t,C.housing-.1,C.housing+.2)*(1-P(t,C.rejected-.15,C.rejected));
 $("#hbx").style.background=hk>.5?"var(--gold)":"";$("#hbx").style.borderColor=hk>.5?"var(--gold)":"";draw("#hbx path",hk);
 [["#r1",C.age],["#r2",C.gender],["#r3",C.zip],["#r4",C.p5]].forEach(([r,a])=>{$(r).style.opacity=.15+.85*ease(P(t,a-.15,a+.2))});
 slam("#stp",t,C.rejected,{s:1.8,r:-14});if(t<C.rejected)$("#stp").style.opacity=0;else $("#stp").style.transform+=" rotate(-8deg)";
 // 2 ad library
 vis("#s2",t,C.p7,C.p11);vis("#lib",t,C.p7,null);E.type("#q",P(t,C.adlibrary,C.adlibrary+.9),"real estate Austin");
 [["#t1",0],["#t2",.15],["#t3",.3]].forEach(([s,d])=>{vis(s,t,C.running-.3+d,null,{dy:40});draw(s+" .ln",1)});
 const wk=ease(P(t,C.weeks,C.weeks+.3));$("#t2").style.boxShadow=`0 0 0 ${5*wk}px #D7AE62`;$("#t2 .rn").style.background=wk>.5?"var(--gold)":"";$("#t2 .rn").style.color=wk>.5?"var(--ox)":"";
 $("#t2").style.transform+=` scale(${1+.06*wk})`;["#t1","#t3"].forEach(s=>$(s).style.opacity=Math.min(+$(s).style.opacity,1-.5*ease(P(t,C.working-.2,C.working+.3))));
 // 3 higher intent
 vis("#s3",t,C.p11,C.p14);vis("#ft",t,C.p11,null);
 const sel=ease(P(t,C.higherintent,C.higherintent+.2));$("#o2 .rd i").style.opacity=sel;$("#o2 .rd").style.borderColor=sel>.5?"var(--ox)":"";$("#o1").style.opacity=1-.5*sel;
