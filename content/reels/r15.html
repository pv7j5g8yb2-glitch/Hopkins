<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="engine.js"></script>
<script>
// Reel 15: the first second of a listing video decides if anyone watches. Open on the best moment.
const {$,$$,P,ease,inout,vis,pop,draw,icon,house}=E;
const CLIPS=[["Logo",0],["Drone, roof",1],["Front door",2],["Kitchen light",3],["Backyard, sunset",4]];
const R={
hook:1,
sfx:[{s:"hit",at:.02,shake:14},{s:"tick",at:"p1"},{s:"tick",at:"p2"},{s:"whoosh",at:"p3"},
 {s:"pop",at:"p4"},{s:"stamp",at:"p6",shake:8},{s:"select",at:"p7"},{s:"whoosh",at:"p8"},
 {s:"pop",at:"kitchen"},{s:"pop",at:"living"},{s:"pop",at:"backyard"},{s:"pop2",at:"p10"},{s:"ding",at:"p12"}],
script:[
 "Nobody is watching your logo intro.",
 {t:"Nobody.",pause:.55},
 "People decide in a second whether to keep watching.",
 {t:"And you're showing them a spinning logo.",pause:.4},
 {t:"Or a drone shot of a roof,",pause:.3},
 "from four hundred feet up.",
 {t:"Cool roof.",pause:.65},
 {t:"Here's the fix.",pause:.35},
 "Open on the best five seconds you've got.",
 "The light in the ^kitchen. The ^living room. The ^backyard at sunset.",
 {t:"The logo goes at the end,",pause:.3},
 "if it goes anywhere.",
 "Your first second is the whole ad.",
],
css:`
#ph{position:absolute;left:300px;top:600px;width:480px;height:800px;border-radius:56px;background:#140609;border:10px solid #3a1c22;box-shadow:0 40px 90px rgba(0,0,0,.55);overflow:hidden}
#scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#logo{width:230px;height:230px;border-radius:50%;border:8px solid var(--rose);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;color:var(--rose);letter-spacing:.08em}
#roof{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center}
#roof .r{width:300px;height:220px;background:#5a4a4e;transform:rotate(12deg);border-radius:10px;box-shadow:inset 0 0 0 14px #6b5a5e}
#roof .lb{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:26px;color:var(--rose);font-weight:700}
#bar{position:absolute;left:40px;right:40px;bottom:34px;height:10px;border-radius:5px;background:rgba(244,235,221,.15);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--gold)}
#swipe{position:absolute;left:640px;top:820px;opacity:0}
#swipe span{display:inline-block;background:var(--plum);color:var(--cream);font-size:40px;font-weight:700;padding:14px 26px;border-radius:16px;border:5px solid var(--cream);transform:rotate(8deg);box-shadow:0 18px 40px rgba(0,0,0,.45)}
#sec{position:absolute;left:0;width:1080px;top:1430px;text-align:center;font-size:34px;color:var(--rose);font-weight:700;opacity:0}
#tl{position:absolute;left:90px;top:720px;width:900px}
#tl .h{font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);margin-bottom:20px}
.cl{position:absolute;left:0;width:900px;height:96px;border-radius:18px;display:flex;align-items:center;gap:20px;padding:0 28px;font-size:34px;font-weight:700;background:var(--cream);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.cl .t{margin-left:auto;font-size:24px;color:var(--quiet)}
.cl.best{background:var(--gold)}
#big{position:absolute;left:0;width:1080px;top:840px;text-align:center;font-size:70px;font-weight:700;line-height:1.1;opacity:0}
#big em{font-family:"Instrument Serif";font-weight:400;font-size:1.2em;color:var(--gold)}
`,
scenes:`
<div class="scene" id="s1"><div id="ph"><div id="scr"><div id="logo">LOGO</div></div>
 <div id="roof"><div class="r"></div><div class="lb">400 ft up</div></div><div id="bar"><i></i></div></div>
 <div id="swipe"><span>Swiped</span></div><div id="sec">one second</div></div>
<div class="scene" id="s2"><div id="tl"><div class="h">Your video, in order</div>
 ${CLIPS.map(([l],i)=>`<div class="cl${i>=3?" best":""}" id="cl${i}">${icon(["target","eye","home","sun","tree"][i],46,"#2A0F14",2)}${l}<span class="t">0:${i*5<10?"0":""}${i*5}</span></div>`).join("")}</div></div>
<div class="scene" id="s3"><div id="big">Your first second<br>is the <em>whole</em> ad.</div></div>
`,
update(t,C,endAt){
 // hook: a phone slams in playing a spinning logo, the one second bar fills, then it's swiped away
 vis("#s1",t,-1,C.p7);E.slam("#ph",t,-.1,{s:1.25,r:-3});
 $("#logo").style.transform=`rotate(${t*140}deg)`;
 $("#bar i").style.width=(ease(P(t,C.p2,C.p2+1))*100)+"%";vis("#sec",t,C.p2,C.p4,{dy:20});
 const sw=ease(P(t,C.p3+.6,C.p3+1));E.slam("#swipe",t,C.p3+.5,{s:1.9,r:12});
 $("#scr").style.opacity=1-ease(P(t,C.p4-.1,C.p4+.2));$("#roof").style.opacity=ease(P(t,C.p4-.1,C.p4+.2));
 $("#ph").style.filter=`grayscale(${ease(P(t,C.p6,C.p6+.4))*.8})`;
 // the timeline: best moments jump to the front, the logo drops to the end
 vis("#s2",t,C.p7,C.e11);
 const mv=inout(P(t,C.p8+.2,C.p8+1.2));
 CLIPS.forEach((c,i)=>{const el=$("#cl"+i);const y0=60+i*116;const target=60+[3,4,2,0,1][i]*116;
   const y=y0+(target-y0)*mv;el.style.top=y+"px";
   const a=C.p7+.1+i*.08;el.style.opacity=ease(P(t,a,a+.3));
   const sc=Math.round((y-60)/116)*5;el.querySelector(".t").textContent=sc<10?"0:0"+sc:"0:"+sc;});
 $("#cl3").style.boxShadow=`0 0 0 ${7*ease(P(t,C.kitchen,C.kitchen+.3))}px var(--cream),0 20px 50px rgba(0,0,0,.35)`;
 $("#cl4").style.boxShadow=`0 0 0 ${7*ease(P(t,C.backyard,C.backyard+.3))}px var(--cream),0 20px 50px rgba(0,0,0,.35)`;
 $("#cl0").style.opacity=Math.min(+$("#cl0").style.opacity,1-.55*ease(P(t,C.p10,C.p10+.4)));
 vis("#s3",t,C.p12,endAt);pop("#big",P(t,C.p12,C.p12+.4));
}};
E.boot(R);
render(0);
</script></body></html>
