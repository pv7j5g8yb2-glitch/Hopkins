update(t,C,endAt){
 // hook: the ad slams in on frame one, then rolls on its own like the jug before it
 vis("#sH",t,0,C.p3-.25,{dy:0,blur:0});
 slam("#ad",t,.02,{s:1.5,r:-8});draw("#adh .ln",1);
 const roll=ease(P(t,C.rolling-.1,C.p3-.3));
 $("#trf").style.width=(roll*100)+"%";$("#ball").style.left=`calc(${roll*100}% - 22px)`;$("#ball").style.transform=`rotate(${roll*720}deg)`;
 const pk=P(t,C.push-.05,C.push+.15);
 vis("#pub",t,C.p2-.15,null,{dy:40});$("#pub").style.transform+=` scale(${1-.12*Math.sin(pk*Math.PI)})`;
 $("#pubt").textContent=t>=C.push+.1?"Live":"Publish";
 pop("#hands",P(t,C.handsoff,C.handsoff+.3));
 // 1 housing

 const hk=P(t,C.housing-.1,C.housing+.2);$("#hbx").style.background=hk>.5?"var(--gold)":"";$("#hbx").style.borderColor=hk>.5?"var(--gold)":"";draw("#hbx path",hk);
 [["#r1",C.age],["#r2",C.gender],["#r3",C.zip],["#r4",C["15mileradius"]]].forEach(([r,a])=>{$(r).style.opacity=.15+.85*ease(P(t,a-.15,a+.2))});
 // 2 three different ideas, not three colours
 vis("#s2",t,C.p6,C.p9);
 [["#i1",C.porch],["#i2",C.kitchen],["#i3",C.price]].forEach(([s,a],i)=>{const k=slam(s,t,Math.max(C.p6+.2+i*.12,a-.05),{s:1.3,r:i%2?5:-5});if(k===0)$(s).style.opacity=0});
 vis("#same",t,C.colours-.4,null,{dy:40});$("#strike").style.transform=`scaleX(${ease(P(t,C.colours+.1,C.colours+.4))})`;
 $$(".mini").forEach(m=>m.style.opacity=1-.55*ease(P(t,C.colours+.2,C.colours+.6)));
 // 3 one ad set: the budget moves to the ad that works
 vis("#s3",t,C.p9,C.p11);vis("#set",t,C.p9,null);
 const mv=ease(P(t,C.working-.5,C.working+.4));const w=[33+37*mv,33-18*mv,33-19*mv],d=[10+11*mv,10-6*mv,10-5*mv];
 [1,2,3].forEach(i=>{const b=$(`#b${i} .bar i`);b.style.width=w[i-1]+"%";b.style.background=i===1&&mv>.5?"var(--gold)":"var(--lilac)";$(`#b${i}n`).textContent=`$${Math.round(d[i-1])} a day`});
 // 4 instant form
 vis("#s4",t,C.p11,C.p13);vis("#ph",t,C.p11,null,{dy:90});draw("#igh .ln",1);vis("#stay",t,C.instagram-.2,null,{dy:30});
 // 5 don't touch it: an edit sends it back to learning, then a full week
 vis("#s5",t,C.p13,C.p16);vis("#lrn",t,C.p13,null);
 const ed=slam("#edit",t,C.donttouchit-.05,{s:1.5,r:-6});if(t<C.donttouchit-.05)$("#edit").style.opacity=0;
 $("#edit .no").style.opacity=ease(P(t,C.donttouchit+.15,C.donttouchit+.35));
 $("#edit").style.opacity=Math.min(+$("#edit").style.opacity||0,1-ease(P(t,C.fullweek-.3,C.fullweek)));
 const rs=ease(P(t,C.learning,C.learning+.35)),wk=P(t,C.fullweek,C.fullweek+1.3);
 const res=rs<1?32*(1-rs):50*ease(wk);$("#lbf").style.width=(res/50*100)+"%";$("#lbn").textContent=Math.round(res)+" of 50 results";
 const act=wk>=1;$("#lst").textContent=act?"Active":rs>.3?"Learning again":"Learning";$("#lst").style.background=act?"var(--gold)":"";$("#lst").style.color=act?"var(--ox)":"";
 $$("#wk div").forEach((d,i)=>{const on=wk*7>i+.5;d.style.background=on?"var(--gold)":"";d.style.color=on?"var(--ox)":"";d.style.borderColor=on?"var(--gold)":""});
 // 6 cost per lead, not likes
 vis("#s6",t,C.p16,C.p19);vis("#cpl",t,C.p16,null);
 const cp=ease(P(t,C.costperlead-.1,C.costperlead+.3));$$(".tr .cp").forEach(e=>{e.style.color=cp>.5?"var(--bronze)":"";e.style.transform=`scale(${1+.08*cp})`});
 const lk=ease(P(t,C.pay-.6,C.pay));$$(".tr .lk s").forEach(s=>s.style.width=(lk*70)+"px");$$(".tr .lk").forEach(e=>e.style.opacity=1-.5*lk);
 const off=ease(P(t,C.losers,C.losers+.4));["#c2","#c3"].forEach(r=>{$(r).style.opacity=1-.6*off;const s=$(r+" .sw");s.style.background=off>.5?"#cdbfae":"";s.querySelector("i").style.left=(39-34*off)+"px"});

 pop("#keep",P(t,C.winner+.1,C.winner+.4));
 // share
 vis("#s7",t,C.p19,endAt);vis("#share",t,C.p19,null);[0,1].forEach(i=>pop($$("#share u")[i],P(t,C.p19+.8+i*.3,C.p19+1.1+i*.3)));
}};
