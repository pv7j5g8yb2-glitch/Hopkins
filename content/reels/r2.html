<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="engine.js"></script>
<script>
const {$,$$,P,ease,inout,vis,pop,draw,count,icon,house}=E;
const notes=[...Array(10)].map((_,i)=>`<div class="note" id="no${i}"><span>$</span><em>?</em></div>`).join("");
const R={
script:[
 "Around 1900, ^John Wanamaker",
 "is said to have admitted",
 "half his ad money was [wasted.]",
 "He just didn't know [which half.]",
 "In 1923, ^Claude Hopkins",
 "wrote down how to know.",
 "Every ad got a ^coupon with its own code.",
 "Count the coupons that come back,",
 "and you know [which ad sold.]",
 "You can run the same test on Meta today.",
 "In Ads Manager, open [A/B test.]",
 "Change [one thing] only.",
 "The ^photo, the ^first line, or the ^offer.",
 "Never all three at ^once,",
 "or you won't know [what worked.]",
 "Let it run [at least a week,]",
 "and don't ^touch it while it runs.",
 "Then judge it by [cost per lead,]",
 "not by ^likes.",
 "Keep the ^winner.",
 "Test it against a ^new idea.",
 "Repeat until you find _your_ half.",

css:`
#store{position:absolute;left:390px;top:560px;width:300px;text-align:center;color:var(--cream)}
#store .t{font-size:26px;font-weight:700;margin-top:6px}#store .s{font-size:21px;color:var(--rose)}

#cur{position:absolute;left:0;top:0;width:40px}
#abp{left:180px;top:1060px;width:720px;padding:30px 34px}
#abp h3{font-size:28px;margin-bottom:18px}.vv{display:flex;gap:18px}.vv div{flex:1;border:2px solid rgba(42,15,20,.14);border-radius:14px;padding:18px;font-weight:700;font-size:23px;text-align:center}
.chips{position:absolute;left:0;width:1080px;top:600px;display:flex;justify-content:center;gap:22px}
.ch{font-size:30px;font-weight:700;padding:20px 32px;border-radius:50px;border:3px solid var(--rose);color:var(--cream);display:flex;align-items:center;gap:12px}
.pair{position:absolute;top:800px;width:400px;padding:22px}.pair .ph{height:250px;border-radius:12px;overflow:hidden}.pair .ph svg{width:400px;height:247px;margin-left:-22px}
.pair .q{font-weight:700;font-size:25px;margin-top:16px}.pair .s{font-size:20px;color:var(--quiet);margin-top:6px}
#pA{left:110px}#pB{left:570px}
#mess{position:absolute;left:0;width:1080px;top:1240px;text-align:center;font-family:"Instrument Serif";font-style:italic;font-size:120px;color:var(--gold)}
#cal{left:150px;top:600px;width:780px;padding:34px 38px}
#cal h3{font-size:28px;display:flex;justify-content:space-between}
.days{display:flex;gap:14px;margin-top:26px}.day{flex:1;height:150px;border-radius:16px;background:var(--paper);border:2px solid rgba(42,15,20,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:var(--quiet);position:relative;overflow:hidden}
.day i{position:absolute;left:0;right:0;bottom:0;background:var(--gold);height:0}.day span{position:relative}
#hands{position:absolute;left:0;width:1080px;top:1050px;display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:700;font-size:40px}
#pencil{position:absolute;left:640px;top:1130px}
#sb{left:110px;top:600px;width:860px;padding:34px 38px}
#sb table{width:100%;border-collapse:collapse;font-size:26px}#sb th{text-align:right;font-size:19px;color:var(--quiet);letter-spacing:.06em;text-transform:uppercase;padding-bottom:14px}
#sb th:first-child,#sb td:first-child{text-align:left}#sb td{padding:24px 0;border-top:1px solid rgba(42,15,20,.1);text-align:right;font-weight:700}
#sb td.big{font-size:52px;letter-spacing:-.03em}#rowB td{position:relative}
#strike{position:absolute;height:5px;background:var(--plum);border-radius:3px;top:0;left:0}
#wtag{position:absolute;left:0;width:1080px;top:1120px;text-align:center}
.lp{position:absolute;top:640px;width:380px;padding:22px}.lp .ph{height:230px;border-radius:12px;overflow:hidden}.lp .ph svg{width:380px;height:235px;margin-left:-22px}
.lp .q{font-weight:700;font-size:24px;margin-top:14px}
#lW{left:130px}#lN{left:570px}
#ref{position:absolute;left:490px;top:1110px}
#save{position:absolute;left:0;width:1080px;top:680px;display:flex;flex-direction:column;align-items:center;gap:30px;font-size:34px;font-weight:700;color:var(--rose)}
`,
scenes:`
<div class="scene" id="s1"><div id="store">${icon("store",150,"#F4EBDD",1.4)}<div class="t">Wanamaker's</div><div class="s">Department store, Philadelphia</div></div>
 <div id="notes">${notes}</div>
 <div class="src" style="top:1420px">The line is widely attributed to John Wanamaker. Nobody has found where he said it.</div></div>
<div class="scene" id="s2">
 <div class="card" id="book"><div class="bt">Scientific Advertising</div><div><div class="ba">Claude C. Hopkins</div><div class="by">1923</div></div></div>
 <div id="clips"><div class="clip" id="clA"><div class="hdl">A home that runs itself.</div><div class="bdy">Send for the free booklet.</div><div class="coupon">Mail this coupon<b>Key A · Dept. 12</b></div></div>
 <div class="clip" id="clB"><div class="hdl">Coffee on the porch by seven.</div><div class="bdy">Send for the free booklet.</div><div class="coupon">Mail this coupon<b>Key B · Dept. 14</b></div></div></div>
 <div id="envs"></div>
 <div class="tally" id="tA"><div class="n" id="nA">0</div><div class="l">came back, Key A</div></div>
 <div class="tally" id="tB"><div class="n" id="nB">0</div><div class="l">came back, Key B</div></div>
 <div class="src" style="top:1440px">Illustration. Hopkins keyed each coupon so he could count which ad brought replies</div></div>
<div class="scene" id="s3">
 <div class="card" id="am"><div class="bar"><span class="bt">+ Create</span><span class="bt">Duplicate</span><span class="bt" id="abt">A/B test</span></div>
  <div class="rows"><div class="rw"><span>Campaign</span><b>Listing, Oak Street</b></div><div class="rw"><span>Objective</span><b>Leads</b></div><div class="rw"><span>Budget</span><b>$1,000</b></div></div></div>
 <svg id="cur" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19Z" fill="#F4EBDD" stroke="#2A0F14" stroke-width="1.4"/></svg>
 <div class="card" id="abp"><h3>New A/B test</h3><div class="vv"><div>Version A</div><div>Version B</div></div></div>
</div>
<div class="scene" id="s4">
 <div class="chips"><div class="ch" id="c1">Photo</div><div class="ch" id="c2">First line</div><div class="ch" id="c3">Offer</div></div>
 <div class="card pair" id="pA"><div class="ph">${house("q1",400,247)}</div><div class="q">Morning sun on the porch.</div><div class="s">Version A · day photo</div></div>
 <div class="card pair" id="pB"><div class="ph">${house("q2",400,247)}</div><div class="q">Morning sun on the porch.</div><div class="s">Version B · dusk photo</div></div>
 <div id="mess">which one?</div></div>
<div class="scene" id="s5"><div class="card" id="cal"><h3>A/B test <span style="color:var(--quiet);font-size:22px">Running</span></h3>
 <div class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<div class="day" id="d${i}"><i></i><span>${d}</span></div>`).join("")}</div></div>
 <div id="hands"><span id="lockI">${icon("lock",110,"#D7AE62",1.6)}</span><span>Hands off.</span></div>
 
 <div class="src" style="top:1330px">Most guides say at least 7 days, so every day of the week gets counted</div></div>
<div class="scene" id="s6"><div class="card" id="sb"><table><tr><th>Version</th><th>Likes</th><th>Cost per lead</th></tr>
 <tr id="rowA"><td>A · day photo</td><td class="big" id="lA">0</td><td class="big" id="pA2">$0</td></tr>
 <tr id="rowB"><td>B · dusk photo</td><td class="big" id="lB">0</td><td class="big" id="pB2">$0</td></tr></table></div>
 <div id="wtag"><span class="pill" style="background:var(--gold);color:var(--ox);font-size:30px;padding:16px 30px" id="wp">B wins. Fewer likes, cheaper leads.</span></div>
 <div class="src" style="top:1260px">Example numbers</div></div>
<div class="scene" id="s7">
 <div class="card lp" id="lW"><div class="ph">${house("w1",380,235)}</div><div class="q">B · dusk photo</div><div class="lbl" style="color:var(--bronze);margin-top:8px">Winner</div></div>
 <div class="card lp" id="lN"><div class="ph">${house("w2",380,235)}</div><div class="q">C · new first line</div><div class="lbl" style="color:var(--quiet);margin-top:8px">Challenger</div></div>
 <div id="ref">${icon("refresh",100,"#D7AE62",1.6)}</div></div>
<div class="scene" id="s8"><div id="save"><svg width="170" height="170" viewBox="0 0 24 24" fill="none" stroke="#D7AE62" stroke-width="1.5" stroke-linejoin="round"><path id="bm" d="M6 3h12v18l-6-4.5L6 21Z" pathLength="1"/></svg>Save this</div></div>
`,
update(t,C,endAt){
 // 1 store + notes
 vis("#s1",t,0,C.e3);draw("#store path,#store rect,#store circle",P(t,.2,1.4));
 R.notes.forEach((n,i)=>{const k=E.back(P(t,C.p1+i*.06,C.p1+.4+i*.06));let x=n.x,y=n.y;
   const w=ease(P(t,C.wasted,C.wasted+.4));const q=ease(P(t,C.whichhalf,C.whichhalf+.5));
   const sh=Math.sin((t-C.whichhalf)*6+i)*28*q;
   n.el.style.opacity=E.clamp(k*2);n.el.style.transform=`translate(${x+sh}px,${y+(1-k)*60+Math.cos((t-C.whichhalf)*5+i)*16*q}px) rotate(${n.r}deg)`;
   const bad=i%2===0;n.el.style.background=`color-mix(in srgb,var(--plum) ${(bad?w*(1-q):0)*100}%,var(--cream))`;
   n.el.querySelector("span").style.opacity=1-q;n.el.querySelector("em").style.opacity=q});
 // 2 Hopkins coupons
 vis("#s2",t,C.p4,C.e8);vis("#book",t,C.p4,C.p6);
 vis("#clips",t,C.p6,null);
 R.envs.forEach(e=>{const q=E.clamp((t-C.p7-e.d)/.9);const tx=e.b?760:320,ty=1180;const sx=e.b?760:320,sy=960;
   e.el.style.opacity=q>0&&q<1?1:0;e.el.style.transform=`translate(${sx+(tx-sx)*q-30}px,${sy+(ty-sy)*q-40*Math.sin(q*Math.PI)}px) scale(${1-.4*q})`});
 vis("#tA",t,C.p7+.2,null,{dy:30});vis("#tB",t,C.p7+.3,null,{dy:30});
 count("#nA",P(t,C.p7+.3,C.p8+.6),0,37);count("#nB",P(t,C.p7+.3,C.p8+.6),0,112);
 const sb=ease(P(t,C.whichadsold,C.whichadsold+.4));$("#clB").style.boxShadow=`0 0 0 ${6*sb}px #D7AE62,0 30px 70px rgba(0,0,0,.45)`;
 // 3 Ads Manager
 vis("#s3",t,C.p9,C.e10);vis("#am",t,C.p9,null);
 const cm=inout(P(t,C.p10,C.abtest));$("#cur").style.opacity=E.clamp(P(t,C.p10-.2,C.p10)*3);$("#cur").style.transform=`translate(${880-260*cm}px,${1000-330*cm}px) scale(${1-.15*Math.sin(P(t,C.abtest,C.abtest+.25)*Math.PI)})`;
 $("#abt").style.transform=`scale(${1-.08*Math.sin(P(t,C.abtest,C.abtest+.25)*Math.PI)})`;
 vis("#abp",t,C.abtest+.25,null,{dy:40});
 // 4 one thing
 vis("#s4",t,C.p11,C.e14);
 ["#c1","#c2","#c3"].forEach((c,i)=>{vis(c,t,C.p11+i*.12,null,{dy:20,blur:8});const sel=i===0?ease(P(t,C.onething,C.onething+.3)):0;
   const all=ease(P(t,C.once,C.once+.3));const k=Math.max(sel,all*(i===0?1:1));
   $(c).style.background=k>.5?(all>.5?"var(--plum)":"var(--gold)"):"transparent";$(c).style.color=k>.5&&all<.5?"var(--ox)":"var(--cream)";$(c).style.borderColor=k>.5?(all>.5?"var(--plum)":"var(--gold)"):"var(--rose)";
   if(i===0&&sel>.5&&all<.5)$(c).style.boxShadow="0 0 40px rgba(215,174,98,.5)";else $(c).style.boxShadow="none"});
 vis("#pA",t,C.photo,null);vis("#pB",t,C.photo+.15,null);draw("#q1 .ln",1);draw("#q2 .ln",1);
 // B has dusk: darker sky, lit windows
 
 const ms=ease(P(t,C.once,C.once+.3));$("#pB .q").textContent=ms>.5?"Ready by Christmas. Offers Friday.":"Morning sun on the porch.";
 $("#pB .s").textContent=ms>.5?"Version B · dusk photo, new line, new offer":"Version B · dusk photo";
 vis("#mess",t,C.whatworked,null,{dy:30,blur:10});
 // 5 a week
 vis("#s5",t,C.p15,C.e16);vis("#cal",t,C.p15,null);
 [...Array(7)].forEach((_,i)=>{$("#d"+i+" i").style.height=(100*ease(P(t,C.atleastaweek+i*.18,C.atleastaweek+.25+i*.18)))+"%";$("#d"+i).style.color=P(t,C.atleastaweek+i*.18,C.atleastaweek+.25+i*.18)>.5?"var(--ox)":""});
 vis("#hands",t,C.touch,null,{dy:30});draw("#lockI path,#lockI rect",P(t,C.touch,C.touch+.6));
 // 6 scoreboard
 vis("#s6",t,C.p17,C.e18);vis("#sb",t,C.p17,null);
 const sk=P(t,C.p17+.3,C.p17+1.4);count("#lA",sk,0,412);count("#lB",sk,0,128);count("#pA2",sk,0,48,v=>"$"+Math.round(v));count("#pB2",sk,0,22,v=>"$"+Math.round(v));
 const lk=ease(P(t,C.likes,C.likes+.3));$("#lA").style.color=`color-mix(in srgb,var(--quiet) ${lk*100}%,var(--ink))`;$("#lB").style.color=$("#lA").style.color;
 $("#pB2").style.color=lk>.5?"var(--bronze)":"";vis("#wtag",t,C.likes+.3,null,{dy:20});
 // 7 loop
 vis("#s7",t,C.p19,C.e21);vis("#lW",t,C.p19,null);draw("#w1 .ln",1);
 $("#lW").style.boxShadow=`0 0 0 5px #D7AE62,0 40px 90px rgba(0,0,0,.45)`;
 vis("#lN",t,C.new,null,{dx:200,dy:0});draw("#w2 .ln",1);
 const rr=P(t,C.p21,C.e21);vis("#ref",t,C.p20+.3,null,{dy:0});draw("#ref path",P(t,C.p20+.3,C.p20+1));$("#ref").style.transform+=` rotate(${rr*360}deg)`;
 // 8 save
 vis("#s8",t,C.p22,endAt);draw("#bm",P(t,C.p22,C.p22+.7));$("#bm").setAttribute("fill",P(t,C.p22+.7,C.p22+.9)>.5?"#D7AE62":"none");
}};
E.boot(R);E.dusk('q2');E.dusk('w1');
R.notes=[...Array(10)].map((_,i)=>({el:$("#no"+i),x:(i%5)*160+10,y:Math.floor(i/5)*130+90,r:(E.rnd()-.5)*8}));
R.envs=[...Array(18)].map((_,i)=>{const el=document.createElement("div");el.className="env";el.innerHTML=`<svg width="60" height="44" viewBox="0 0 60 44"><rect x="2" y="2" width="56" height="40" rx="4" fill="#F4EBDD" stroke="#5B4873" stroke-width="3"/><path d="M4 5l26 20L56 5" fill="none" stroke="#5B4873" stroke-width="3"/></svg>`;$("#envs").appendChild(el);return {el,d:E.rnd()*1.6,b:i%3!==0}});
render(0);
</script></body></html>
