<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="engine.js"></script>
<script>
// Clean pinned cover for the launch film: the Hopkins mark and name, "Meet" above, one line below.
// Everything sits inside the 3:4 grid crop (y 240 to 1680). No call to action, so it can stay pinned.
const CSS=`
@font-face{font-family:"Inter Tight";font-weight:400;src:url(../fonts/Inter_Tight_400_normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:700;src:url(../fonts/Inter_Tight_700_normal.woff2)}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(../fonts/Instrument_Serif_400_italic.woff2)}
:root{--ox:#2A0F14;--cream:#F4EBDD;--gold:#D7AE62;--rose:#C3A9A2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ox)}
body{font-family:"Inter Tight",sans-serif;-webkit-font-smoothing:antialiased;color:var(--cream);position:relative}
#glow{position:absolute;left:300px;top:260px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(215,174,98,.30),rgba(215,174,98,0) 68%)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,transparent 40%,rgba(10,2,4,.55) 100%)}
#grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay}
#mk{position:absolute;left:150px;top:340px;width:780px;height:666px}
.meet{position:absolute;left:0;right:0;top:1060px;text-align:center;font-family:"Instrument Serif";font-style:italic;font-size:104px;color:var(--gold);line-height:1}
.nm{position:absolute;left:0;right:0;top:1150px;text-align:center;font-size:250px;font-weight:700;letter-spacing:-.065em;line-height:1}
.line{position:absolute;left:0;right:0;top:1475px;text-align:center;font-size:74px;font-weight:700;letter-spacing:-.04em;word-spacing:.08em;line-height:1.02}
.line em{font-family:"Instrument Serif";font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--gold);font-size:1.14em}
`;
const st=document.createElement("style");st.textContent=CSS;document.head.appendChild(st);
document.body.innerHTML=`<div id="glow"></div><div id="vig"></div><svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<svg id="mk" viewBox="14 14 96 82">${E.MARK}</svg>
<div class="meet">Meet</div><div class="nm">Hopkins</div>
<div class="line">Manage your ads<br>from <em>one chat.</em></div>`;
</script></body></html>
