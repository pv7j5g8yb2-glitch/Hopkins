<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="engine.js"></script>
<script src="chat.js"></script>
<script>
const {$,$$,P,ease,vis,pop,slam,show}=E;
// Reel 9 (2026-11-01): five things an agent can ask an assistant this week, each shown done in the
// Hopkins chat. Teaching reel: the chat is on screen throughout, the voice never sells it.
const R={
theme:"new",hook:2,
sfx:[{s:"hit",at:.02,shake:14},{s:"stamp",at:"houses",shake:10},
 ...["one","two","three","four","five"].map(c=>({s:"pop",at:c})),
 {s:"pop2",at:"carousel",d:.6},{s:"pop2",at:"reel",d:.6},{s:"pop2",at:"email",d:.6},{s:"pop2",at:"story",d:.6},{s:"ding",at:"leadsnotlikes"},
 {s:"select",at:"monday"}],
script:[
 "Five things I'd ask my AI assistant this week",
 {t:"if I sold [houses.]",pause:.4},
 "^One. A ^carousel for first time buyers in your city.",
 {t:"That's the stuff people save and send to their partner.",pause:.4},
 "^Two. A short ^reel on what changed in your market this month.",
 {t:"Then check the numbers yourself before you post it.",pause:.4},
 "^Three. An ^email to the buyer who went quiet after two showings.",
 {t:"No pressure. One question. That's it.",pause:.4},
 "^Four. A ^story for Saturday's open house,",
 {t:"with the address and the time on it.",pause:.4},
 "^Five. How did my ads do last week?",
 {t:"In real numbers. [Leads, not likes.]",pause:.4},
 {t:"Save this, and try one on ^Monday.",pause:.3},
],
css:`
.ph{top:540px;height:1230px}
.ph .sb,.ph .hd{position:relative;z-index:2;background:#0B0B0D}
#num{position:absolute;left:58px;top:470px;width:190px;height:190px;border-radius:50%;background:var(--sun);color:#0B0B0D;font-size:120px;font-weight:700;letter-spacing:-.06em;display:flex;align-items:center;justify-content:center;opacity:0;z-index:4;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.rl{margin-left:58px;width:250px;height:444px;border-radius:18px;background:#141416;box-shadow:0 0 0 1.5px rgba(255,255,255,.12);padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.rl small{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#F0708A}.rl b{font-size:34px;line-height:1.02;letter-spacing:-.03em}
.rl i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;align-self:center}
.mail{margin:14px 0 0 58px;background:#141416;border-radius:18px;padding:22px 24px;font-size:24px;line-height:1.45;box-shadow:0 0 0 1.5px rgba(255,255,255,.1)}
.mail b{display:block;font-size:20px;color:rgba(255,255,255,.6);margin-bottom:8px;font-weight:700}
.st{margin-left:58px;width:250px;height:444px;border-radius:18px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.st div{position:absolute;left:16px;right:16px;bottom:16px;background:#111;color:#fff;border-radius:12px;padding:16px}
.st small{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#D7AE62}.st b{display:block;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:34px;line-height:1.05;margin-top:6px}
.nums{display:flex;gap:12px;margin:14px 0 0 58px}.nums div{flex:1;background:#141416;border-radius:16px;padding:18px;box-shadow:0 0 0 1.5px rgba(255,255,255,.1)}
.nums b{display:block;font-size:46px;letter-spacing:-.03em}.nums span{font-size:18px;color:rgba(255,255,255,.65)}
#ex{position:absolute;left:150px;width:780px;top:1792px;text-align:center;font-size:22px;color:rgba(255,255,255,.6);opacity:0}
`,
scenes:`
<div class="scene" id="sB">${E.phone("pa",{logo:true,box:"Ask Hopkins anything",items:[
 {id:"m1",who:"me",text:"make a carousel for first time buyers in Austin"},
 {id:"h1",who:"hk",text:"Here's your carousel. Want a caption and hashtags for it?",extra:`<div class="slides" style="margin-top:16px">
   <div class="sl" style="background:#F4EBDD;color:#1A1A1A"><small>First time buyers</small><b>Buying your first home in Austin</b><small>1 / 6</small></div>
   <div class="sl" style="background:#F4EBDD;color:#1A1A1A"><small>Step 1</small><b>Pull your free credit reports</b><small>2 / 6</small></div>
   <div class="sl" style="background:#F4EBDD;color:#1A1A1A"><small>Step 2</small><b>Get pre approved, not pre qualified</b><small>3 / 6</small></div></div>`},
 {id:"m2",who:"me",text:"an animated reel on what changed in the Austin market this month"},
 {id:"h2",who:"hk",text:"Here's your reel.",extra:`<div style="margin-top:16px;display:flex"><div class="rl"><small>Austin market</small><b>What changed this month</b><i>▶</i></div></div>`},
 {id:"m3",who:"me",text:"write an email to a buyer who went quiet after two showings"},
 {id:"h3",who:"hk",text:"Here's a short one:",extra:`<div class="mail"><b>Subject: Still looking?</b>Hi Jordan, I know the last two showings weren't quite it. Has anything changed on your side? Happy to send new ones as they come up.<br>Sarah</div>`},
 {id:"m4",who:"me",text:"a story for Saturday's open house at 4503 Avenue F, 1 to 3pm"},
 {id:"h4",who:"hk",text:"Here's your story.",extra:`<div style="margin-top:16px;display:flex"><div class="st" style="background-image:url(../../app/demo/photos/hydepark-1.jpg)"><div><small>Open house · Sat 1 to 3pm</small><b>4503 Avenue F.</b></div></div></div>`},
 {id:"m5",who:"me",text:"how did my ads do last week?"},
 {id:"h5",who:"hk",text:"Last week: 7 leads, 3 asked for a showing. Your best ad was <b>The porch</b>, with 4.",extra:`<div class="nums"><div><b>7</b><span>Leads</span></div><div><b>3</b><span>Showings asked</span></div><div><b>4</b><span>Best ad</span></div></div>`},
]})}<div id="num">1</div><div id="ex">Example numbers</div></div>
`,
update(t,C,endAt){
 vis("#sB",t,0,endAt-.05,{dy:0,blur:0});
 slam(".ph",t,.02,{s:1.3,r:-5});
 // the number of the point, slammed in on its word
 const pts=[C.one,C.two,C.three,C.four,C.five];let cur=-1;pts.forEach((a,i)=>{if(t>=a-.05)cur=i});
 const n=$("#num");
 if(cur<0){n.style.opacity=0}else{n.textContent=cur+1;slam(n,t,pts[cur]-.05,{s:1.6,r:cur%2?10:-10})}
 const steps=[["#m1",.3],["#h1",.9],["#m2",C.reel-.2],["#h2",C.reel+.6],["#m3",C.email-.2],["#h3",C.email+.6],["#m4",C.story-.2],["#h4",C.story+.6],["#m5",C.five+.2],["#h5",C.p11+.1]];
 steps.forEach(([s,a])=>show(s,t,a));
 vis("#ex",t,C.p11+.3,endAt-.2,{dy:10});
}};
E.boot(R);
render(0);
</script></body></html>
