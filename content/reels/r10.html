<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="engine.js"></script>
<script src="chat.js"></script>
<script>
const {$,$$,P,ease,vis,pop,slam,show}=E;
// Reel 10 (2026-11-01), the empty Monday: a lead from Saturday night seen on Monday. What Hopkins
// does about it, all of it real in the app today: the lead on the phone straight away, straight
// into Follow Up Boss, and Today saying who's still waiting and how long.
const R={
theme:"new",hook:2,signoff:true,cta:"Join the waitlist · link in bio",
sfx:[{s:"hit",at:.02,shake:14},{s:"stamp",at:"monday",shake:12},{s:"whoosh",at:"moved"},
 {s:"ding",at:"phone"},{s:"select",at:"followupboss"},{s:"pop",at:"today"},{s:"stamp",at:"35hours",shake:8},
 {s:"pop2",at:"call"},{s:"hit",at:"onechat",shake:10}],
script:[
 "Your ad got a lead on Saturday night.",
 {t:"You saw it on [Monday.]",pause:.45},
 "By then they'd ^moved on,",
 {t:"or someone else had called them first.",pause:.45},
 "Here's what I'd set up instead.",
 "Every lead from your ad hits your ^phone",
 {t:"the second it comes in.",pause:.35},
 {t:"Name, number, and which ad brought them.",pause:.4},
 "It goes straight into [Follow Up Boss,]",
 {t:"so nothing lives in a spreadsheet.",pause:.4},
 "And if you still haven't called by Sunday,",
 "Hopkins puts it at the top of ^Today:",
 {t:"Noah's been waiting [35 hours.]",pause:.4},
 {t:"One tap, and you ^call him.",pause:.4},
 {t:"No dashboard to check. [One chat.]",pause:.3},
],
css:`
#cal{position:absolute;left:190px;top:700px;width:700px;border-radius:30px;overflow:hidden;background:#141416;box-shadow:0 0 0 1.5px rgba(255,255,255,.12),0 40px 90px rgba(0,0,0,.6);opacity:0}
#cal .top{height:120px;background:var(--sun);color:#0B0B0D;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;letter-spacing:-.03em}
#cal .row{display:flex;align-items:center;gap:22px;padding:30px 36px;border-top:1px solid rgba(255,255,255,.1);font-size:34px}
#cal .row b{width:150px;font-weight:700}#cal .row span{color:rgba(255,255,255,.7)}
#cal .row.on span{color:#fff;font-weight:700}
#gone{position:absolute;left:300px;top:1390px;width:480px;height:110px;border-radius:55px;background:#F0708A;color:#0B0B0D;font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:0}
.ph{top:540px;height:1230px}
.ph .sb,.ph .hd{position:relative;z-index:2;background:#0B0B0D}
.lock{position:absolute;inset:0;background:url(field.jpg) center/cover;display:flex;flex-direction:column;align-items:center;padding-top:150px}
.lock .tm{font-size:150px;font-weight:300;letter-spacing:-.05em}.lock .dt{font-size:30px;color:rgba(255,255,255,.85)}
.nt{position:absolute;left:26px;right:26px;border-radius:30px;background:rgba(40,40,44,.97);padding:22px 26px;display:flex;gap:18px;align-items:center;opacity:0}
.nt .ic{width:64px;height:64px;border-radius:15px;background:linear-gradient(#26262B,#08080A);display:flex;align-items:center;justify-content:center;flex:none}
.nt b{display:block;font-size:24px}.nt span{display:block;font-size:22px;color:rgba(255,255,255,.78);margin-top:4px}
.nt small{position:absolute;right:26px;top:22px;font-size:18px;color:rgba(255,255,255,.5)}
#fub{position:absolute;left:150px;top:640px;width:780px;border-radius:30px;background:#fff;color:#16181d;opacity:0;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6)}
#fub .bar{height:84px;background:#1d2b44;color:#fff;display:flex;align-items:center;padding:0 30px;font-size:28px;font-weight:700;gap:14px}
#fub .p{display:flex;align-items:center;gap:22px;padding:30px;border-bottom:1px solid #e7e9ee}
#fub .p i{width:76px;height:76px;border-radius:50%;background:#e9edf5;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:28px;color:#1d2b44}
#fub .p b{display:block;font-size:32px}#fub .p span{display:block;font-size:22px;color:#6b7280;margin-top:4px}
#fub .tag{margin-left:auto;font-size:20px;font-weight:700;padding:8px 16px;border-radius:20px;background:#fde8ee;color:#B9408F}
#fub .k{display:flex;gap:16px;padding:22px 30px 30px;font-size:22px;color:#6b7280}#fub .k b{color:#16181d}
#today{position:absolute;left:0;right:0;top:158px;bottom:0;padding:30px 34px}
#today h2{font-size:64px;font-weight:300;letter-spacing:-.04em;margin-top:10px}
#today .sec{font-size:26px;font-weight:700;margin:48px 0 18px}
#today .attn{background:#141416;border-radius:26px;padding:30px;box-shadow:0 0 0 1.5px rgba(255,255,255,.1)}
#today .attn b{display:block;font-size:31px}#today .attn p{font-size:24px;color:rgba(255,255,255,.72);margin-top:10px;line-height:1.4}
#today .attn .a{display:flex;gap:14px;margin-top:24px}#today .attn .a span{font-size:24px;font-weight:700;padding:15px 28px;border-radius:30px;background:#fff;color:#0B0B0D}#today .attn .a span.d{background:none;color:#fff}
#calling{position:absolute;inset:0;background:#0B0B0D;display:flex;flex-direction:column;align-items:center;padding-top:200px;opacity:0}
#calling i{width:180px;height:180px;border-radius:50%;background:#2a2a2e;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:64px;font-weight:700}
#calling b{font-size:56px;margin-top:40px;letter-spacing:-.02em}#calling span{font-size:28px;color:rgba(255,255,255,.7);margin-top:10px}
`,
scenes:`
<div class="scene" id="sA"><div id="cal"><div class="top">This weekend</div>
 <div class="row on" id="r1"><b>Sat</b><span>9:47pm · New lead · Noah Park</span></div>
 <div class="row" id="r2"><b>Sun</b><span>Nothing</span></div>
 <div class="row" id="r3"><b>Mon</b><span>9:02am · You see it</span></div></div>
 <div id="gone">Moved on</div></div>
<div class="scene" id="sB"><div class="ph" id="pl" style="opacity:1"><div class="lock"><div class="dt">Saturday 1 November</div><div class="tm">9:47</div></div>
 <div class="nt" id="n1" style="top:560px"><div class="ic">${E.mk(46)}</div><div><b>New lead · 2814 Westover Hills Dr</b><span>Noah Park · (512) 555 0123 · Ad: The pool</span></div><small>now</small></div></div></div>
<div class="scene" id="sC"><div id="fub"><div class="bar">People</div>
 <div class="p"><i>NP</i><div><b>Noah Park</b><span>2814 Westover Hills Dr · Ad: The pool</span></div><span class="tag">Hopkins</span></div>
 <div class="p" style="opacity:.55"><i>MC</i><div><b>Maya Chen</b><span>1107 Travis Heights Blvd</span></div><span class="tag">Hopkins</span></div>
 <div class="k"><span>Source <b>Hopkins</b></span><span>Stage <b>Lead</b></span></div></div></div>
<div class="scene" id="sD"><div class="ph" style="opacity:1"><div class="sb"><span>9:02</span><span>●●● ▮</span></div>
 <div class="hd"><span class="lg">${E.mk(40)}Hopkins</span></div>
 <div id="today"><h2>Good morning, Sarah</h2><div class="sec">Needs attention</div>
  <div class="attn" id="at"><b>Noah Park is waiting for a reply</b><p>Asked about 2814 Westover Hills Dr 35 hours ago. Still marked New.</p><div class="a"><span id="cb">Call Noah</span><span class="d">Dismiss</span></div></div></div>
 <div id="calling"><i>NP</i><b>Noah Park</b><span>calling…</span></div></div></div>
`,
update(t,C,endAt){
 // hook: the weekend, a lead on Saturday, seen Monday
 vis("#sA",t,0,C.p4-.1,{dy:0,blur:0});
 slam("#cal",t,.02,{s:1.4,r:-6});
 $("#r3").classList.toggle("on",t>=C.monday-.05);$("#r1").style.opacity=t>=C.monday?.55:1;
 slam("#gone",t,C.moved-.05,{s:1.6,r:8});if(t<C.moved-.05)$("#gone").style.opacity=0;
 // the lead on the phone the second it comes in
 vis("#sB",t,C.p5-.1,C.followupboss-.15,{dy:0,blur:0});
 const ph=$("#pl");slam(ph,t,C.p5-.1,{s:1.2,r:4});
 vis("#n1",t,C.phone-.1,null,{dy:-60});
 // straight into Follow Up Boss
 vis("#sC",t,C.followupboss-.2,C.p10+.1,{dy:0,blur:0});
 slam("#fub",t,C.followupboss-.2,{s:1.3,r:-5});
 // Today on Monday morning
 vis("#sD",t,C.p10+.1,endAt-.05,{dy:0,blur:0});
 slam("#sD .ph",t,C.p10+.1,{s:1.2,r:4});
 const ak=ease(P(t,C.today-.1,C.today+.3));$("#at").style.opacity=ak;$("#at").style.transform=`translateY(${(1-ak)*40}px)`;
 const hk=P(t,C["35hours"]-.1,C["35hours"]+.3);$("#at").style.boxShadow=`0 0 0 ${1.5+3*ease(hk)}px rgba(240,112,138,${.1+.8*ease(hk)})`;
 const cb=P(t,C.call-.15,C.call+.1);$("#cb").style.transform=`scale(${1-.1*Math.sin(cb*Math.PI)})`;
 vis("#calling",t,C.call+.15,null,{dy:0,blur:0});
}};
E.boot(R);
render(0);
</script></body></html>
