update(t,C,endAt){
 vis("#s1",t,0,C.e1);
 const t1="Spacious 4 bed home on a quiet street, ",t2="perfect for families.";
 E.type("#typ1",P(t,.3,1.9),t1);E.type("#typ2",P(t,1.9,2.6),t2);
 $("#ed .caret").style.opacity=Math.floor(t*2.2)%2?1:.15;
 draw("#sq path",P(t,C.trouble,C.trouble+.4));const ak=P(t,C.trouble+.1,C.trouble+.5);pop("#alert",ak);draw("#alert path",ak);
 $("#warn").style.opacity=ease(P(t,C.trouble+.4,C.trouble+.8));
 vis("#s2",t,C.p2,C.e4);
 [["#f1",C.perfect],["#f2",C.ideal],["#f3",C.adults]].forEach(([f,a])=>{vis(f,t,a,null,{dx:-120,dy:0});draw(f+" path",P(t,a+.1,a+.6));$(f+" .strk").style.width=(ease(P(t,C.e4-.6,C.e4-.1))*720)+"px"});
 vis("#s3",t,C.p5,C.e9);vis("#law",t,C.p5,null);
 $$("#law .cls span").forEach((s,i)=>{const k=E.clamp(P(t,C.p5+.4+i*.08,C.p5+.7+i*.08)*2);s.style.opacity=k});
 const fk=ease(P(t,C.preference,C.preference+.3));$("#fam").style.background=fk>.5?"var(--gold)":"";$("#fam").style.borderColor=fk>.5?"var(--gold)":"";

 pop("#wa .stamp",P(t,C.liable,C.liable+.3));pop("#wp .stamp",P(t,C.liable+.15,C.liable+.45));
 vis("#s4",t,C.p10,C.e11);vis("#bh",t,C.home,null);draw("#bh path",P(t,C.home,C.home+.8));
 vis("#bb",t,C.notthebuyer,null);$("#bb .strk2").style.transform=`scaleX(${ease(P(t,C.notthebuyer+.3,C.notthebuyer+.6))}) rotate(-20deg)`;
 vis("#s5",t,C.p12,C.e16);
 [["#w1",C.p12,C.fenced,"#n1","Fenced yard. Park two blocks away.",C.e13],["#w2",C.p14,C.ten,"#n2","Ten minute walk to the train.",C.e15]].forEach(([w,a,b,n,txt,e])=>{
   vis(w,t,a,null,{dx:-80,dy:0});$(w+" .o i").style.width=(ease(P(t,a+.5,a+.9))*290)+"px";E.type(n,P(t,b,e),txt);draw(w+" .nw path,"+w+" .nw rect,"+w+" .nw circle",P(t,b,b+.7));
   $(w+" .nw").style.opacity=P(t,b-.1,b)>0?1:0});
 vis("#w3",t,C.p16,null,{dx:-80,dy:0});$("#w3 .o i").style.width=(ease(P(t,C.deleted,C.deleted+.3))*170)+"px";$("#w3 .nw").style.opacity=ease(P(t,C.deleted,C.deleted+.3));
 vis("#s6",t,C.p20,C.e22);
 const dk=[C.are,C.are+.35,C.are+.7];
 R.dots.forEach(d=>{let o=.55;const near=R.near.indexOf(d);if(near>=0){const k=ease(P(t,dk[R.grp[near]]+.3,dk[R.grp[near]]+.7));d.ci.style.fill=k>.5?"#D7AE62":"#F4EBDD";d.ci.setAttribute("r",5+5*k);o=.55+.45*k}
   else{o=.55*(1-.6*ease(P(t,C.themselves,C.themselves+.4)))}d.ci.style.opacity=o});
 [["#d1",120,700],["#d2",560,640],["#d3",360,1170]].forEach(([d,x,y],i)=>{const k=P(t,dk[i],dk[i]+.4);pop(d,k);$(d).style.left=x+"px";$(d).style.top=y+"px"});
 vis("#sF",t,C.p17,C.e19);vis("#fine",t,C.p17,null);
 [["#g1",C.walkinclosets],["#g2",C.great],["#g3",C.jogging],["#g4",C.bus]].forEach(([g,a])=>{vis(g,t,a-.1,null,{dy:16,blur:6});draw(g+" svg *",P(t,a,a+.4))});

 [["#k1",C.place],["#k3",C.place+.3],["#k2",C.person]].forEach(([k,a])=>pop(k+" .tg",P(t,a,a+.3)));

R.dots=[];{const g=$("#dots");for(let r=0;r<17;r++)for(let c=0;c<20;c++){const x=22+c*45+(r%2)*22,y=22+r*45;if(x>890||Math.hypot(x-450,y-380)>325)continue;const ci=document.createElementNS("http://www.w3.org/2000/svg","circle");ci.setAttribute("cx",x);ci.setAttribute("cy",y);ci.setAttribute("r",5);ci.style.fill="#F4EBDD";g.appendChild(ci);R.dots.push({ci,x,y})}}
// dots near each detail chip
const anchors=[[230,170],[640,110],[420,610]];R.near=[];R.grp=[];
anchors.forEach(([ax,ay],gi)=>{R.dots.map(d=>[Math.hypot(d.x-ax,d.y-ay),d]).sort((a,b)=>a[0]-b[0]).slice(0,4).forEach(([_,d])=>{R.near.push(d);R.grp.push(gi)})});
