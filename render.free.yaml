# Free test version: no card needed. The free plan has no persistent disk, so accounts and decisions
# disappear whenever the service restarts, and it sleeps after about 15 minutes without a visit.
# The sample workspace always comes back. Use render.yaml (Starter plan) for anything longer lived.
services:
  - type: web
    name: lincoln
    runtime: node
    rootDir: lincoln
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /signin
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /tmp/lincoln-data
      - key: LLM_BASE_URL
        value: https://api.llmsrelay.com/v1
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_API_KEY
        sync: false
