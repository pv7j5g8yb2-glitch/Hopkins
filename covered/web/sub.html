<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Upload certificates</title>
<style>
:root { --bg:#F6F4EF; --card:#fff; --ink:#111; --mute:#6b6b66; --line:#e6e2da; --ok:#1f9d63; --soon:#d98a00; --bad:#d6453d; }
@media (prefers-color-scheme: dark) { :root { --bg:#0e0e0f; --card:#17171a; --ink:#f3f1ec; --mute:#9a9a94; --line:#2a2a2e; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system, "Inter", system-ui, sans-serif; }
.wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color:var(--mute); font-size:14px; }
input, select { width:100%; font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); }
label { display:block; font-size:13px; color:var(--mute); margin: 12px 0 6px; }
button { font:inherit; border:0; border-radius:999px; padding:14px 20px; background:var(--ink); color:var(--bg); font-weight:600; width:100%; margin-top:14px; touch-action:manipulation; }
button:active { transform:scale(.97); opacity:.85; }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
.item { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.item:first-child { border-top:0; }
.dot { width:12px; height:12px; border-radius:50%; background:var(--ok); flex:none; }
.dot.soon { background:var(--soon); } .dot.bad { background:var(--bad); }
.err { color:var(--bad); font-size:14px; min-height:20px; margin-top:8px; }
.done { color:var(--ok); font-weight:600; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub">Loading</div></div>
<script>
const token = location.pathname.split("/").pop();
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const words = (i) => i.state === "missing" ? "Missing" : i.state === "expired" ? "Expired" : i.days === 0 ? "Expires today" : `${i.days} days left`;
async function load() {
  const r = await fetch("/api/s/" + token);
  if (!r.ok) { app.innerHTML = "<h1>Link not found</h1><div class='sub'>Ask the company to send you a new one.</div>"; return; }
  const d = await r.json();
  app.innerHTML = `
    <h1>${esc(d.company)}</h1>
    <div class="sub">Certificates on file for ${esc(d.name)}</div>
    <div class="card">${d.status.map((i) => `<div class="item"><span class="dot ${i.state === "ok" ? "" : i.state === "soon" ? "soon" : "bad"}"></span><div style="flex:1"><b>${esc(i.label)}</b><div class="sub">${i.expires ? "Expires " + esc(i.expires) : "Nothing on file"}</div></div><span class="sub">${words(i)}</span></div>`).join("")}</div>
    <form class="card" id="f">
      <b>Upload a certificate</b>
      <label>Type</label><select name="kind">${Object.entries(d.kinds).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select>
      <label>Expires</label><input name="expires" type="date" required>
      <label>Carrier</label><input name="carrier">
      <label>File</label><input name="file" type="file" accept="application/pdf,image/png,image/jpeg" required>
      <div class="err" id="e"></div>
      <button>Upload</button>
    </form>`;
  document.getElementById("f").onsubmit = async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target); const file = fd.get("file");
    const e = document.getElementById("e");
    try {
      const buf = new Uint8Array(await file.arrayBuffer()); let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
      const r = await fetch(`/api/s/${token}/cert`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind: fd.get("kind"), expires: fd.get("expires"), carrier: fd.get("carrier"), data: btoa(s), mime: file.type, name: file.name }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
      await load(); document.getElementById("app").insertAdjacentHTML("afterbegin", "<p class='done'>Uploaded</p>");
    } catch (x) { e.textContent = x.message; }
  };
}
load();
</script>
</body>
</html>
