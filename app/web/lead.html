<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta property="og:title" content="__TITLE__">
<meta property="og:image" content="__OG_IMAGE__">
<meta property="og:description" content="__OG_DESC__">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--p:#1F2A36;--a:#C8A96A;--bg:#FAF8F5;--ink:#1c1c1c;--quiet:#6f6a66;--line:rgba(0,0,0,.09)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.top{background:var(--p);color:var(--on);padding:14px 18px;display:flex;align-items:center;gap:12px}
.top img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff}
.top b{font-size:16px;letter-spacing:-.02em}
.wrap{max-width:980px;margin:0 auto}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;background:#111}
.gal img{flex:none;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start}
@media (min-width:760px){.gal img{width:70%}}
.count{font-size:12px;color:var(--quiet);padding:8px 18px 0}
.grid{display:grid;grid-template-columns:1fr;gap:26px;padding:20px 18px 40px}
@media (min-width:860px){.grid{grid-template-columns:1.2fr 1fr;padding:28px 18px 60px}}
.oh{display:inline-block;background:var(--a);color:#1c1c1c;font-weight:700;font-size:13px;padding:5px 10px;border-radius:8px;margin-bottom:10px}
h1{font-size:30px;letter-spacing:-.04em;line-height:1.1}
.serif h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em;font-size:38px}
.price{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:6px;color:var(--p)}
.facts{color:var(--quiet);font-size:16px;margin-top:4px}
.sold{display:inline-block;background:#1c1c1c;color:#fff;font-weight:700;font-size:13px;padding:5px 10px;border-radius:8px;margin-bottom:10px}
form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
form h2{font-size:19px;letter-spacing:-.03em;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips label{border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:600;cursor:pointer}
.chips input{display:none}
.chips label:has(input:checked){border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
.f{margin-top:10px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.f input,.f textarea{width:100%;border:1px solid rgba(0,0,0,.16);border-radius:11px;padding:12px;font:inherit;font-size:16px;outline:none;background:#fff}
.f input:focus,.f textarea:focus{border-color:var(--p)}
.hp{position:absolute;left:-9999px}
button{width:100%;margin-top:16px;background:var(--p);color:var(--on);border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#a02a2a;font-weight:600;font-size:14px;margin-top:10px;min-height:1em}
.done{text-align:center;padding:30px 10px}
.done b{display:block;font-size:22px;letter-spacing:-.03em;margin-bottom:6px}
.agent{margin-top:22px;display:flex;align-items:center;gap:12px;font-size:14px}
.agent .av{width:44px;height:44px;border-radius:50%;background:var(--p);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:700}
.agent a{color:var(--p);font-weight:700}
.legal{border-top:1px solid var(--line);padding:18px;font-size:12px;color:var(--quiet);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legal svg{width:26px;height:26px;flex:none}
</style>
</head>
<body>
<script id="data" type="application/json">__DATA__</script>
<div class="top"><span id="logo"></span><b id="biz"></b></div>
<div class="wrap">
  <div class="gal" id="gal"></div>
  <div class="count" id="count"></div>
  <div class="grid">
    <div>
      <div id="badges"></div>
      <h1 id="addr"></h1>
      <div class="price" id="price"></div>
      <div class="facts" id="facts"></div>
      <div class="agent" id="agent"></div>
    </div>
    <form id="f" novalidate>
      <h2 id="ftitle">Book a showing</h2>
      <div class="chips">
        <label><input type="radio" name="wants" value="showing" checked>Book a showing</label>
        <label><input type="radio" name="wants" value="info">Ask a question</label>
        <label><input type="radio" name="wants" value="offer">Talk about an offer</label>
      </div>
      <div class="f"><label for="name">Name</label><input id="name" autocomplete="name"></div>
      <div class="f"><label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel"></div>
      <div class="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
      <div class="f"><label for="note">Message (optional)</label><textarea id="note" rows="2" placeholder="Preferred times or questions"></textarea></div>
      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button id="go" type="submit">Send</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <div class="legal"><svg viewBox="0 0 32 32"><path d="M16 3 3 13h4v15h18V13h4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11 17h10M11 22h10" stroke="currentColor" stroke-width="2"/></svg><span>Equal Housing Opportunity.</span><span id="license"></span><a href="/privacy" style="color:inherit;margin-left:auto">Privacy policy</a></div>
</div>
<script>
(function () {
  const d = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const b = d.brand;
  const dark = (hex) => { const h = hex.replace("#", ""); const [r, g, bl] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); return 0.2126 * r + 0.7152 * g + 0.0722 * bl < 0.55; };
  document.documentElement.style.setProperty("--p", b.primary);
  document.documentElement.style.setProperty("--a", b.accent);
  document.documentElement.style.setProperty("--on", dark(b.primary) ? "#fff" : "#1c1c1c");
  if (b.font === "classic") document.body.classList.add("serif");
  if (b.logo) { const i = document.createElement("img"); i.src = "/photos/" + b.logo; i.alt = ""; $("logo").appendChild(i); }
  $("biz").textContent = b.business;
  $("gal").innerHTML = d.photos.map((id, i) => `<img src="/photos/${id}" alt="Photo ${i + 1}" loading="${i ? "lazy" : "eager"}">`).join("");
  if (d.photos.length > 1) $("count").textContent = `${d.photos.length} photos, swipe to see them all`;
  $("addr").textContent = [d.address, d.area || d.city].filter(Boolean).join(", ") || "New listing";
  $("price").textContent = d.price;
  $("facts").textContent = d.facts;
  if (d.status === "sold") $("badges").innerHTML = '<span class="sold">Sold</span>';
  else if (d.openHouse) { const s = document.createElement("span"); s.className = "oh"; s.textContent = "Open house: " + d.openHouse; $("badges").appendChild(s); }
  const initials = (b.agent || b.business || "").split(" ").map((w) => w[0]).join("").slice(0, 2);
  $("agent").innerHTML = `<div class="av"></div><div><b></b><br>${b.phone ? `<a href="tel:${b.phone.replace(/[^\d+]/g, "")}"></a>` : ""}</div>`;
  $("agent").querySelector(".av").textContent = initials;
  $("agent").querySelector("b").textContent = b.agent || b.business;
  if (b.phone) $("agent").querySelector("a").textContent = b.phone;
  if (b.license) $("license").textContent = b.license;
  document.querySelectorAll("input[name=wants]").forEach((r) => r.addEventListener("change", () => {
    $("ftitle").textContent = { showing: "Book a showing", info: "Ask a question", offer: "Talk about an offer" }[r.value];
  }));
  if (d.status === "sold") { document.querySelector("input[value=info]").checked = true; $("ftitle").textContent = "Ask about homes like this"; }
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").textContent = "";
    $("go").disabled = true;
    const body = {
      name: $("name").value, phone: $("phone").value, email: $("email").value, note: $("note").value, website: $("website").value,
      wants: document.querySelector("input[name=wants]:checked").value, v: q.get("v"), src: q.get("utm_source") || q.get("src"),
    };
    try {
      const res = await fetch(`/api/l/${d.slug}/lead`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const r = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(r.error || "Couldn't send. Please try again.");
      $("f").innerHTML = '<div class="done"><b>Sent.</b><span></span></div>';
      $("f").querySelector("span").textContent = `${b.agent || b.business} has your details and will be in touch.`;
    } catch (err) {
      $("err").textContent = err.message;
      $("go").disabled = false;
    }
  });
})();
</script>
</body>
</html>
