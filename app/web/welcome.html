<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1F1F1F">
<title>Hopkins</title>
<link rel="icon" href="/static/mark.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/welcome.css">
<script>try{var a=localStorage.getItem("hpk-appearance");if(a==="light"||(a==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.flowTheme="light"}catch(e){}</script>
</head>
<body>
<!-- Hopkins' front door (Ismael, 2026-11-05, after Cosmos' app, watched frame by frame): the intro
     for someone new, then sign up or sign in one question at a time. Someone who has used Hopkins
     on this device skips the intro and lands on the email question. -->
<div class="stage" id="stage">
  <div class="strobe" id="strobe" aria-hidden="true"></div>
  <div class="mark" id="mark" aria-hidden="true">
    <svg viewBox="0 0 120 120"><path class="p-small" d="M55.9 85.8C54.8 88.1 52.2 89.9 49.9 91.2C47.6 92.6 44.8 93.5 42.1 93.9C39.4 94.4 35.9 94.8 33.4 93.7C31.0 92.6 29.1 89.4 27.5 87.3C25.9 85.2 25.4 83.2 24.0 81.0C22.7 78.9 20.2 76.8 19.5 74.3C18.7 71.8 18.8 68.5 19.6 66.0C20.5 63.4 22.3 60.3 24.6 58.9C27.0 57.4 30.9 57.0 33.8 57.5C36.6 57.9 39.2 60.5 41.7 61.7C44.1 62.9 46.4 63.2 48.6 64.6C50.7 66.0 53.2 67.9 54.5 70.0C55.9 72.2 56.2 75.1 56.4 77.7C56.7 80.3 57.0 83.5 55.9 85.8Z"/><path class="p-big" d="M97.0 31.0C98.4 33.8 99.0 36.2 100.4 39.5C101.7 42.7 105.3 46.7 105.1 50.5C104.9 54.3 102.0 59.3 99.0 62.3C95.9 65.2 90.8 67.3 86.7 68.2C82.7 69.1 78.3 68.5 74.7 67.7C71.2 67.0 68.2 65.4 65.3 63.8C62.4 62.2 59.8 60.5 57.4 58.1C55.1 55.7 51.8 52.7 51.2 49.4C50.7 46.1 52.8 41.9 54.1 38.3C55.4 34.7 56.8 30.9 59.3 27.7C61.7 24.4 65.2 20.5 68.9 18.8C72.7 17.1 77.8 16.8 81.6 17.5C85.4 18.1 89.2 20.3 91.7 22.6C94.3 24.8 95.5 28.2 97.0 31.0Z"/></svg>
  </div>
  <button class="login" id="login" type="button">Log in</button>

  <section class="page" id="p1" data-pill="Start">
    <p class="line">Plan, design and post<br>your week</p>
    <div class="collage" id="collage"></div>
    <h1 class="word" id="word">HOPKINS</h1>
  </section>
  <section class="page" id="p2" data-pill="Next">
    <p class="line">Made from your photos<br>and your city</p>
    <div class="stack" id="stack"></div>
  </section>
  <section class="page" id="p3" data-pill="Next">
    <p class="line">Your whole week,<br>planned for you</p>
    <div class="grid" id="grid"></div>
  </section>
  <section class="page" id="p4" data-pill="Get started">
    <p class="line">Approve once a week.<br>Hopkins posts for you.</p>
    <div class="hero" id="hero"></div>
  </section>

  <div class="foot" id="foot">
    <p class="legal" id="legal">By creating an account, you agree to the<br><a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a></p>
    <button class="pill" id="pill" type="button"><span id="pillText">Start</span></button>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  </div>
</div>

<!-- One question at a time. -->
<div class="flow" id="flow" aria-live="polite">
  <header class="fhead">
    <button class="back" id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <div class="bar" id="bar"><i id="barFill"></i></div>
  </header>
  <div class="screen" id="screen"></div>
  <div class="fdock" id="fdock">
    <button class="go" id="go" type="button"><span id="goText">Continue</span><b id="goCount"></b><span class="spin" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M55.9 85.8C54.8 88.1 52.2 89.9 49.9 91.2C47.6 92.6 44.8 93.5 42.1 93.9C39.4 94.4 35.9 94.8 33.4 93.7C31.0 92.6 29.1 89.4 27.5 87.3C25.9 85.2 25.4 83.2 24.0 81.0C22.7 78.9 20.2 76.8 19.5 74.3C18.7 71.8 18.8 68.5 19.6 66.0C20.5 63.4 22.3 60.3 24.6 58.9C27.0 57.4 30.9 57.0 33.8 57.5C36.6 57.9 39.2 60.5 41.7 61.7C44.1 62.9 46.4 63.2 48.6 64.6C50.7 66.0 53.2 67.9 54.5 70.0C55.9 72.2 56.2 75.1 56.4 77.7C56.7 80.3 57.0 83.5 55.9 85.8Z"/><path d="M97.0 31.0C98.4 33.8 99.0 36.2 100.4 39.5C101.7 42.7 105.3 46.7 105.1 50.5C104.9 54.3 102.0 59.3 99.0 62.3C95.9 65.2 90.8 67.3 86.7 68.2C82.7 69.1 78.3 68.5 74.7 67.7C71.2 67.0 68.2 65.4 65.3 63.8C62.4 62.2 59.8 60.5 57.4 58.1C55.1 55.7 51.8 52.7 51.2 49.4C50.7 46.1 52.8 41.9 54.1 38.3C55.4 34.7 56.8 30.9 59.3 27.7C61.7 24.4 65.2 20.5 68.9 18.8C72.7 17.1 77.8 16.8 81.6 17.5C85.4 18.1 89.2 20.3 91.7 22.6C94.3 24.8 95.5 28.2 97.0 31.0Z"/></svg></span></button>
    <button class="aside" id="aside" type="button"></button>
  </div>
</div>
<!-- Safari has no vibrate, but a switch toggled by a tap ticks: every tap gets one. -->
<label class="tick" id="tick" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script src="/static/welcome.js"></script>
</body>
</html>
