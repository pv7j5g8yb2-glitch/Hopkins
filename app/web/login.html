<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopkins</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A0F14">
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hopkins">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--ox:#2A0F14;--ox2:#36151C;--oxl:#4A222A;--cream:#F4EBDD;--gold:#D7AE62;--gold2:#c99d4f;--rose:#C3A9A2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--ox);color:var(--cream);font-family:"Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:40px 16px;min-height:100vh;position:relative;isolation:isolate}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:overlay;z-index:-1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.box{width:100%;max-width:400px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;letter-spacing:-.045em;margin-bottom:34px}
.logo img{width:34px;height:34px;animation:rise .9s .1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.8)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,p.sub{animation:up .5s .15s cubic-bezier(.2,.8,.2,1) both}form{animation:up .5s .25s cubic-bezier(.2,.8,.2,1) both}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;margin:0;background:none;color:var(--rose);font-size:13px;font-weight:600;padding:6px 8px}
button:active{transform:scale(.98)}.pw button:hover{background:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
h1{font-size:40px;line-height:1;letter-spacing:-.05em;margin-bottom:10px}
h1 em{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em}
p.sub{color:var(--rose);font-size:16px;margin-bottom:26px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;color:var(--rose);margin:14px 0 6px}
input{width:100%;background:var(--ox2);border:1px solid var(--oxl);color:var(--cream);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(215,174,98,.2)}
input::placeholder{color:#9C807A}
button{width:100%;margin-top:22px;background:var(--gold);color:var(--ox);border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:var(--gold2)}
button:disabled{opacity:.6}
.err{color:#f0b3a8;font-size:14px;font-weight:600;margin-top:12px;min-height:1.2em}
.switch{margin-top:22px;font-size:14px;color:var(--rose)}
.switch a{color:var(--cream);font-weight:600}
.signup-only{display:none}
.mode-signup .signup-only{display:block}
.forgot{display:block;margin-top:12px;padding:13px;border:1px solid var(--oxl);border-radius:12px;background:var(--ox2);color:var(--cream);font-size:16px;font-weight:600;text-align:center;text-decoration:none;transition:border-color .15s,background .15s}
.forgot:hover{border-color:var(--rose)}
.forgot:active{transform:scale(.98)}
.mode-login #sub,.mode-signup #sub{display:none}
.mode-login h1,.mode-signup h1{margin-bottom:22px}
.mode-forgot .pw-field,.mode-reset .email-field,.mode-signup .forgot,.mode-forgot .forgot,.mode-reset .forgot{display:none}
.done{margin-top:18px;background:var(--ox2);border:1px solid var(--oxl);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.5}
.foot{margin-top:40px;font-size:12.5px;color:#9C807A;line-height:1.5;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.foot a{color:var(--cream)}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="/static/mark.svg" alt="">Hopkins</div>
  <h1 id="title">Welcome <em>back.</em></h1>
  <p class="sub" id="sub">One chat for your real estate marketing. Nothing goes live without your approval.</p>
  <form id="f" novalidate>
    <div class="signup-only"><label for="name">Your name</label><input id="name" autocomplete="name" placeholder="Sam Ellery"></div>
    <div class="signup-only"><label for="business">Business, team or brokerage</label><input id="business" autocomplete="organization" placeholder="Ellery Realty"></div>
    <div class="email-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@yourbrokerage.com"></div>
    <div class="pw-field"><label for="password" id="pwlabel">Password</label><div class="pw"><input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters"><button type="button" id="show">Show</button></div>
</div>
    <div class="signup-only"><label for="invite">Invite code</label><input id="invite" autocomplete="off" placeholder="From your invite email"></div>
    <button id="go" type="submit">Sign in</button>
    <a class="forgot" href="/forgot">Forgot password?</a>
    <div class="err" id="err"></div>
  </form>
  <div class="switch" id="switch"></div>
  <p class="foot"><span>No invite code? <a href="https://waitlist.kirmistudio.com">Join the waitlist</a>.</span><a href="/privacy">Privacy policy</a></p>
</div>
<script>
(function () {
  const path = location.pathname;
  const params = new URLSearchParams(location.search);
  const mode = path === "/forgot" ? "forgot" : path === "/reset" ? "reset" : path === "/signup" || params.has("invite") ? "signup" : "login";
  const signup = mode === "signup";
  const $ = (id) => document.getElementById(id);
  document.body.classList.add(`mode-${mode}`);
  if (signup) {
    $("title").innerHTML = "Start with <em>one listing.</em>";
    $("go").textContent = "Create my account";
    $("password").autocomplete = "new-password";
    $("switch").innerHTML = 'Already have an account? <a href="/login">Sign in</a>';
    const code = params.get("invite");
    if (code) $("invite").value = code;
  } else if (mode === "forgot") {
    $("title").innerHTML = "Forgot your <em>password?</em>";
    $("sub").textContent = "Enter your account email to receive a reset link.";
    $("go").textContent = "Send reset link";
    $("switch").innerHTML = 'Remembered it? <a href="/login">Sign in</a>';
  } else if (mode === "reset") {
    $("title").innerHTML = "Choose a new <em>password.</em>";
    $("sub").textContent = "At least 8 characters. You'll be signed out on other devices.";
    $("pwlabel").textContent = "New password";
    $("password").autocomplete = "new-password";
    $("go").textContent = "Save and sign in";
    $("switch").innerHTML = '<a href="/login">Back to sign in</a>';
  } else {
    $("switch").innerHTML = 'Got an invite? <a href="/signup">Create your account</a>';
  }
  $("show").addEventListener("click", () => {
    const p = $("password");
    p.type = p.type === "password" ? "text" : "password";
    $("show").textContent = p.type === "password" ? "Show" : "Hide";
  });
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").textContent = "";
    $("go").disabled = true;
    const body = mode === "reset" ? { t: params.get("t"), password: $("password").value } : mode === "forgot" ? { email: $("email").value } : { email: $("email").value, password: $("password").value };
    if (signup) Object.assign(body, { name: $("name").value, business: $("business").value, invite: $("invite").value });
    const url = { signup: "/api/signup", login: "/api/login", forgot: "/api/forgot", reset: "/api/reset" }[mode];
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");
      if (mode === "forgot") {
        const done = document.createElement("div");
        done.className = "done";
        done.textContent = `Done. If ${$("email").value.trim()} has an account, a reset link is on its way. It works once, for 48 hours.`;
        $("f").replaceWith(done);
        return;
      }
      location.href = "/";
    } catch (err) {
      $("err").textContent = err.message;
      $("go").disabled = false;
    }
  });
})();
</script>
</body>
</html>
